plugins { id 'com.android.application' }
android {
    namespace 'kr.ianlogistics.kakaocollector'
    compileSdk 35
    defaultConfig { applicationId 'kr.ianlogistics.mmscollector'; minSdk 33; targetSdk 35; versionCode 9; versionName '0.4.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.java.srcDirs = ['src/main/java', layout.buildDirectory.dir('generated/shared')]
}
def sharedSources = tasks.register('syncSharedSources', Sync) {
    from('../app/src/main/java') { include '**/Store.java', '**/Rules.java', '**/OneDrive.java' }
    into(layout.buildDirectory.dir('generated/shared'))
}
tasks.named('preBuild').configure { dependsOn(sharedSources) }
