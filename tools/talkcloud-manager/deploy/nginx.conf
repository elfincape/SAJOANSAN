server {
    listen 8443 ssl;
    server_name 211.233.219.199;
    ssl_certificate /etc/letsencrypt/live/ian-erp-pilot/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ian-erp-pilot/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    client_body_timeout 10s;
    location / {
        proxy_pass http://127.0.0.1:19220;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        access_log off;
    }
}
