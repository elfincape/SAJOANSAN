<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>코스표 · 사조안산</title>
  <link rel="stylesheet" href="/css/common.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
      box-sizing: border-box;
    }

    *, *::before, *::after {
      box-sizing: inherit;
    }

    body {
      padding: 10px 12px;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      border: 1px solid #3f3f46;   /* zinc-700 */
      border-radius: 10px;
      overflow: hidden;
      background: #18181b;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.25),
        0 14px 40px rgba(0, 0, 0, 0.35);
    }

    #filter-bar {
      flex-shrink: 0;
    }

    #table-area {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #18181b;
    }

    #flat-view {
      flex: 1;
      overflow: auto;
      border: 1px solid #27272a;
      border-radius: 6px;
      background: #18181b;
    }

    #group-view {
      flex: 1;
      overflow: auto;
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100">
<div id="app">

  <!-- 헤더 -->
  <header class="border-b border-zinc-800 shrink-0 bg-zinc-900">
    <div class="max-w-[1600px] mx-auto px-4 py-2 flex items-center gap-3 flex-wrap">
      <div class="flex items-center gap-2 min-w-0">
        <div class="w-7 h-7 rounded-md bg-emerald-600/20 border border-emerald-600/40 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-emerald-400"
               fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3 7h11v8H3zM14 10h4l3 3v2h-7zM6.5 18a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM17.5 18a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/>
          </svg>
        </div>
        <span class="text-sm font-semibold">코스표</span>
      </div>

      <div class="flex-1"></div>

      <span id="user-badge" class="text-xs text-zinc-400 hidden sm:inline"></span>
      <a id="admin-link" href="/admin/" class="btn btn-ghost text-xs hidden">관리 허브</a>
      <button id="me-btn" class="btn btn-ghost text-xs">내 정보</button>
      <button id="logout-btn" class="btn btn-ghost text-xs">로그아웃</button>
    </div>
  </header>

  <!-- 필터 바 -->
  <div id="filter-bar" class="border-b border-zinc-800 bg-zinc-900/95">
    <div class="max-w-[1600px] mx-auto px-4 py-2 flex flex-wrap items-center gap-2">

      <!-- 다중선택 드롭다운 -->
      <div data-multi="company_name" class="min-w-[110px]"></div>
      <div data-multi="route_name"   class="min-w-[120px]"></div>
      <div data-multi="car_number"   class="min-w-[90px]"></div>
      <div data-multi="dp_region"    class="min-w-[100px]"></div>
      <div data-multi="security_key_location" class="min-w-[120px]"></div>
      <div data-multi="security_password" class="min-w-[100px]"></div>
      <div data-multi="driver_name"  class="min-w-[100px]"></div>

      <!-- 텍스트 검색 -->
      <input id="search-input" type="search"
             placeholder="납품처·주소·차량번호 검색"
             class="app-input w-44 text-xs"
             autocomplete="off">

      <!-- 진입조건 체크박스 -->
      <span class="text-xs text-zinc-500 ml-1">진입:</span>
      <label class="cb text-xs"><input type="checkbox" data-cb="entry_cond" value="allow_under_1ton"> 1t</label>
      <label class="cb text-xs"><input type="checkbox" data-cb="entry_cond" value="allow_under_3_5ton"> 3.5t</label>
      <label class="cb text-xs"><input type="checkbox" data-cb="entry_cond" value="allow_over_5ton"> 5t+</label>
      <label class="cb text-xs"><input type="checkbox" data-cb="entry_cond" value="allow_unmanned_yard"> 야적</label>

      <div class="flex-1"></div>

      <!-- 뷰 토글 -->
      <div class="flex rounded overflow-hidden border border-zinc-700 text-xs shrink-0">
        <button class="view-toggle px-2.5 py-1.5" data-view="flat">목록</button>
        <button class="view-toggle px-2.5 py-1.5" data-view="group">코스별</button>
      </div>

      <button id="reset-sort"    class="btn btn-ghost text-xs shrink-0">정렬 초기화</button>
      <button id="reset-filters" class="btn btn-ghost text-xs shrink-0">필터 초기화</button>

      <span id="active-filter-count" class="text-xs text-amber-400 shrink-0"></span>
      <span id="result-count"        class="text-xs text-zinc-400 shrink-0"></span>
    </div>
  </div>

  <!-- 로딩 표시 -->
  <div id="loading-indicator" class="hidden shrink-0 text-center py-3 text-sm text-zinc-400">
    데이터를 불러오는 중…
  </div>

  <!-- 테이블 영역 -->
  <div id="table-area" class="px-2 py-1">
    <div id="flat-view"></div>
    <div id="group-view" class="hidden space-y-3 py-1"></div>
  </div>

</div>

<script type="module" src="/js/dashboard.js"></script>
</body>
</html>
