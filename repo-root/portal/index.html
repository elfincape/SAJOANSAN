<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>업무 포털 · 이안물류</title><link rel="stylesheet" href="/css/operations.css"><link rel="stylesheet" href="/css/portal.css"></head>
<body class="portal-shell">
<a class="skip-link" href="#portal-main">본문으로 이동</a>
<div id="portal-sidebar" class="portal-sidebar" aria-label="업무 포털 메뉴">
 <div class="sidebar-brand"><a href="/portal/">이안물류<span>통합 업무 포털</span></a><button data-navigation-toggle id="sidebar-close" class="sidebar-close" type="button" aria-label="메뉴 닫기">닫기</button></div>
 <div class="sidebar-content">
  <details class="sidebar-group" open><summary>센터 업무</summary><nav id="center-navigation" data-center-view="center" aria-label="센터 업무"><button data-view="incidents">특이사항</button></nav></details>
  <details class="sidebar-group"><summary>업무 등록·조사</summary><nav data-center-view="surveys" aria-label="센터별 업무 등록"></nav></details>
  <section id="hq-navigation" hidden><details class="sidebar-group" open><summary>배송팀</summary><nav aria-label="배송팀 업무"><button data-view="hq" hidden>전체 업무·지원 요청</button><button data-view="briefing" hidden>AI 브리핑</button><button data-view="access" hidden>센터 담당자 배정</button></nav></details></section>
  <details class="sidebar-group" open><summary>조회·알림</summary><nav aria-label="조회와 알림"><button data-view="search">통합 검색</button><button data-view="notifications">알림함 <span id="unread"></span></button></nav></details>
  <details class="sidebar-group"><summary>운영 관리</summary><nav aria-label="운영 기록"><a href="/admin/operations.html">처리 기록</a><button data-view="trash">휴지통</button><button data-view="backups" hidden>운영 원본 보관</button><a id="audit-navigation" href="/admin/audit-log.html" hidden>운영정보 변경 이력</a></nav></details>
 </div>
 <div class="sidebar-footer"><a href="/admin/">운영관리 열기 <span aria-hidden="true">↗</span></a><a href="/">대시보드</a></div>
</div>
<div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>
<div id="portal-content"><header class="portal-header"><button data-navigation-toggle id="sidebar-toggle" type="button" aria-controls="portal-sidebar" aria-expanded="false" aria-label="업무 메뉴 열기">메뉴</button><strong>업무 포털</strong><span id="user"></span></header>
<main id="portal-main" tabindex="-1"><div class="heading"><div><h1 id="portal-title" tabindex="-1">업무목록</h1><p id="portal-description">해야 할 업무를 확인하고 바로 처리하세요.</p></div><div class="heading-actions"><button id="refresh">새로고침</button><button id="issue-task" type="button" hidden>업무 발행</button><button id="new-task" class="primary" type="button" hidden>일회성 업무등록</button></div></div>
<div id="message" role="status" aria-live="polite"></div><section id="quick-actions" class="quick-actions" aria-label="업무 등록"></section>
<div class="filters task-toolbar"><select id="center" hidden aria-label="선택한 센터"></select><input id="completed" type="checkbox" checked hidden><div class="toolbar-top"><div class="toolbar-period"><div id="task-unit" class="view-buttons" role="group" aria-label="조회 기간"><button type="button" data-view-control="task-unit" data-value="day" aria-pressed="true">일</button><button type="button" data-view-control="task-unit" data-value="week" aria-pressed="false">주</button><button type="button" data-view-control="task-unit" data-value="month" aria-pressed="false">월</button></div><div class="date-navigation"><button id="period-prev" type="button" aria-label="이전 기간">‹</button><input id="task-date" type="date" aria-label="기준일"><button id="period-next" type="button" aria-label="다음 기간">›</button><button id="period-today" type="button">오늘</button></div></div><div id="task-layout" class="view-buttons" role="group" aria-label="보기 방식"><button type="button" data-view-control="task-layout" data-value="list" aria-pressed="true">목록</button><button type="button" data-view-control="task-layout" data-value="calendar" aria-pressed="false">캘린더</button></div></div><div class="toolbar-bottom"><div id="task-status" class="view-buttons" role="group" aria-label="업무 상태"><button type="button" data-view-control="task-status" data-value="all" aria-pressed="true">전체</button><button type="button" data-view-control="task-status" data-value="active" aria-pressed="false">진행중</button><button type="button" data-view-control="task-status" data-value="completed" aria-pressed="false">완료</button><button type="button" data-view-control="task-status" data-value="delayed" aria-pressed="false">지연</button></div><label class="check"><input id="mine" type="checkbox">내 업무만</label></div></div>
<div class="workspace"><section class="list"><div class="list-heading"><strong id="list-title">업무목록</strong><span id="count"></span></div><div id="items" class="portal-items"></div></section><aside id="detail" aria-label="업무 처리"><p>업무를 선택하세요.</p></aside></div></main></div><dialog id="task-ticket-dialog" class="parent-task-dialog" aria-label="업무 티켓 상세"></dialog><dialog id="parent-task-dialog" class="parent-task-dialog" aria-label="상위 업무 상세"></dialog><script type="module" src="/js/portal-screen.js"></script></body></html>
