             tabindex="0" data-photo="2">

      <div>
        <label class="app-label">추가파레트 1</label>

             tabindex="0" data-photo="3">
          <div class="photo-preview text-xs text-zinc-500 text-center py-6">

        </div>
        <button type="button" data-clear-photo="3" class="mt-1 text-[11px] text-zinc-400 hover:text-rose-300">
          사진 삭제
        </button>
      </div>

      <div>
        <label class="app-label">추가파레트 2</label>
        <input id="f-photo4" type="file" accept="image/*" class="app-input text-xs">
        <div class="paste-zone mt-1 border border-dashed border-zinc-600 rounded-md bg-zinc-900/50 p-2 min-h-[84px] cursor-pointer focus:outline-none focus:ring-2 focus:ring-emerald-500"
             tabindex="0" data-photo="4">
          <div class="photo-preview text-xs text-zinc-500 text-center py-6">
            클릭 후 Ctrl+V로 붙여넣기
          </div>
        </div>

          사진 삭제
        </button>

  <section class="border border-zinc-700 rounded-lg bg-zinc-800/30 p-4">
    <div class="grid grid-cols-1 md:grid-cols-[1fr_auto] gap-3 items-end">
      <div>
        <label class="app-label">다운로드 파일명</label>
        <input id="f-filename" class="app-input" placeholder="이배송_202604">
      </div>
      <button id="btn-download" class="btn btn-primary">엑셀 다운로드</button>
    </div>
  </section>

</main>

<script type="module">
import { supabase } from '/js/supabase.js';
import { requireRole, getCurrentProfile } from '/js/auth.js';
import { toast, confirmDialog, formatPhone } from '/js/ui.js';
import { decorateCenterLinks, forceCenterSelectionFromUrl, mountHeaderCenterSwitcher, requireSelectedCenter, scopeByCenter, withCenterParam } from '/js/center.js';

await requireRole('editor');

const profile = await getCurrentProfile();

document.getElementById('user-badge').textContent =
  `${profile?.display_name || profile?.email || ''} (${profile?.role || ''})`;
const selectedCenter = await requireSelectedCenter({ force: forceCenterSelectionFromUrl() });
mountHeaderCenterSwitcher(next => location.replace(withCenterParam(location.pathname + location.search, next)));
decorateCenterLinks(document);

const ExcelJSLib = window.ExcelJS;

const TEMPLATE_URL = '/assets/templates/transfer-template.xlsx';
const MAX_PHOTO_BYTES = 1024 * 1024;

const $ = id => document.getElementById(id);

const state = {
  companies: [],
  routes: [],
  drivers: [],
  vehicles: [],
  rows: [],
  formPhotos: [null, null, null, null]
};

setToday();
$('f-center').value = selectedCenter.name;
$('f-center').readOnly = true;
await loadMasters();
await loadSavedRows();

bindEvents();
renderRows();

// -----------------------------------------------------------------------------
// 마스터 데이터
// -----------------------------------------------------------------------------
async function loadMasters() {
  const [co, ro, dr, ve] = await Promise.all([
    scopeByCenter(supabase.from('companies').select('id, name').order('name')),
    scopeByCenter(supabase.from('routes')
      .select('id, name, car_number, company_id, primary_driver_id, primary_vehicle_id')
      .order('car_number')),
    scopeByCenter(supabase.from('drivers')
      .select('id, name, phone, contact, company_id')
      .order('name')),
    scopeByCenter(supabase.from('vehicles')
      .select('id, plate_number, company_id')
      .order('plate_number'))
  ]);

  if (co.error || ro.error || dr.error || ve.error) {
    toast('마스터 데이터를 불러오지 못했습니다.', 'error');
    return;
  }

  state.companies = co.data || [];
  state.routes    = ro.data || [];
  state.drivers   = dr.data || [];
  state.vehicles  = ve.data || [];

  $('f-company').innerHTML =
    '<option value="">선택</option>' +
    state.companies.map(x => `<option value="${x.id}">${escapeHtml(x.name)}</option>`).join('');

  refreshDependentSelects();
}

async function loadSavedRows() {
  const { data, error } = await supabase
    .from('transfer_deliveries')
    .select(`
      id,
      center,
      center_code,
      delivery_date,
      company_id,
      route_id,
      driver_id,
      vehicle_id,
      company_name,
      route_name,
      driver_name,
      driver_phone,
      vehicle_plate,
      photo1_data_url,
      photo2_data_url,
      photo3_data_url,
      photo4_data_url,
      memo,
      created_by,
      created_at,
      updated_at
    `)
    .eq('center_code', selectedCenter.code)
    .order('delivery_date', { ascending: true })
    .order('created_at', { ascending: true })
    .limit(1000);

  if (error) {
    toast(`저장된 이배송 목록을 불러오지 못했습니다: ${error.message}`, 'error');
    return;
  }

  state.rows = (data || []).map(dbRowToStateRow);
}

function dbRowToStateRow(x) {
  return {
    _uid: makeUid(),
    id: x.id,

    center: x.center || selectedCenter.name,
    center_code: x.center_code || selectedCenter.code,
    delivery_date: x.delivery_date || '',

    company_id: x.company_id,
    route_id: x.route_id,
    driver_id: x.driver_id,
    vehicle_id: x.vehicle_id,

    company_name: x.company_name || '',
    route_name: x.route_name || '',
    driver_name: x.driver_name || '',
    driver_phone: x.driver_phone || '',
    vehicle_plate: x.vehicle_plate || '',

    photos: [
      x.photo1_data_url || null,
      x.photo2_data_url || null,
      x.photo3_data_url || null,
      x.photo4_data_url || null
    ],

    memo: x.memo || '',
    created_at: x.created_at,
    updated_at: x.updated_at,
    _dirty: false
  };
}

function stateRowToPayload(r) {
  return {
    center: r.center || selectedCenter.name,
    center_code: selectedCenter.code,
    delivery_date: r.delivery_date,

    company_id: r.company_id,
    route_id: r.route_id,
    driver_id: r.driver_id,
    vehicle_id: r.vehicle_id,

    company_name: r.company_name,
    route_name: r.route_name,
    driver_name: r.driver_name,
    driver_phone: r.driver_phone,
    vehicle_plate: r.vehicle_plate,

    photo1_data_url: r.photos?.[0] || null,
    photo2_data_url: r.photos?.[1] || null,
    photo3_data_url: r.photos?.[2] || null,
    photo4_data_url: r.photos?.[3] || null,

    memo: r.memo || '',
    created_by: profile?.id || null
  };
}

function setToday() {
  const d = new Date();
  $('f-date').value =
    `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// -----------------------------------------------------------------------------
// 이벤트
// -----------------------------------------------------------------------------
function bindEvents() {
  $('f-company').addEventListener('change', () => {
    refreshDependentSelects();
  });

  $('f-route').addEventListener('change', () => {
    const route = state.routes.find(r => r.id === $('f-route').value);
    if (!route) return;

    if (route.primary_driver_id) {
      $('f-driver').value = route.primary_driver_id;
    }

    if (route.primary_vehicle_id) {
      $('f-vehicle').value = route.primary_vehicle_id;
    }

    syncPhoneFromDriver();
  });

  $('f-driver').addEventListener('change', syncPhoneFromDriver);

  $('btn-add').addEventListener('click', addRow);
  $('btn-clear-form').addEventListener('click', clearForm);
  $('btn-save-db').addEventListener('click', saveDb);
  $('btn-download').addEventListener('click', downloadExcel);
  $('btn-reload-db').addEventListener('click', reloadDbRows);
  $('btn-delete-selected').addEventListener('click', deleteSelectedRows);
  $('btn-clear-list').addEventListener('click', clearAllRows);

  $('chk-all').addEventListener('change', () => {
    const checked = $('chk-all').checked;
    document.querySelectorAll('.row-check').forEach(chk => {
      chk.checked = checked;
    });
  });

  bindPhotoInputs();
}

function refreshDependentSelects() {
  const companyId = $('f-company').value;

  const routes = state.routes.filter(r => !companyId || r.company_id === companyId);
  const drivers = state.drivers.filter(d => !companyId || d.company_id === companyId);
  const vehicles = state.vehicles.filter(v => !companyId || v.company_id === companyId);

  $('f-route').innerHTML =
    '<option value="">선택</option>' +
    routes.map(r => {
      const label = r.car_number || r.name || '';
      return `<option value="${r.id}">${escapeHtml(label)}</option>`;
    }).join('');

  $('f-driver').innerHTML =
    '<option value="">선택</option>' +
    drivers.map(d => `<option value="${d.id}">${escapeHtml(d.name)}</option>`).join('');

  $('f-vehicle').innerHTML =
    '<option value="">선택</option>' +
    vehicles.map(v => `<option value="${v.id}">${escapeHtml(v.plate_number)}</option>`).join('');

  $('f-phone').value = '';
}

function syncPhoneFromDriver() {
  const d = state.drivers.find(x => x.id === $('f-driver').value);
  $('f-phone').value = d ? formatPhone(d.phone || d.contact || '') : '';
}

// -----------------------------------------------------------------------------
// 행 추가 / 목록
// -----------------------------------------------------------------------------
async function addRow() {
  const company = state.companies.find(x => x.id === $('f-company').value);
  const route   = state.routes.find(x => x.id === $('f-route').value);
  const driver  = state.drivers.find(x => x.id === $('f-driver').value);
  const vehicle = state.vehicles.find(x => x.id === $('f-vehicle').value);

  if (!$('f-date').value) {
    toast('일자를 입력하세요.', 'warn');
    return;
  }

  if (!company || !route || !driver || !vehicle) {
    toast('운수사, 코스, 기사, 차량을 선택하세요.', 'warn');
    return;
  }

  const photos = [...state.formPhotos];

  state.rows.push({
    _uid: makeUid(),
    id: null,

    center: selectedCenter.name,
    center_code: selectedCenter.code,
    delivery_date: $('f-date').value,

    company_id: company.id,
    route_id: route.id,
    driver_id: driver.id,
    vehicle_id: vehicle.id,

    company_name: company.name,
    route_name: route.car_number || route.name || '',
    driver_name: driver.name,
    driver_phone: $('f-phone').value.trim(),
    vehicle_plate: vehicle.plate_number,

    photos,
    memo: $('f-memo').value.trim(),

    _dirty: true
  });

  renderRows();
  clearPhotos();
  toast('행을 추가했습니다. DB 저장을 눌러야 저장됩니다.', 'success');
}

function renderRows() {
  const tbody = $('tbody');
  tbody.innerHTML = '';

  $('row-count').textContent = `${state.rows.length}건`;
  $('empty-msg').classList.toggle('hidden', state.rows.length > 0);

  if ($('chk-all')) {
    $('chk-all').checked = false;
  }

  state.rows.forEach((r, i) => {
    const photoCount = (r.photos || []).filter(Boolean).length;
    const savedText = r.id ? '저장됨' : '미저장';
    const savedClass = r.id ? 'text-emerald-300' : 'text-amber-300';

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="checkbox" class="row-check" data-idx="${i}"></td>
      <td>${i + 1}</td>
      <td>${escapeHtml(r.center)}</td>
      <td>${escapeHtml(formatDateKr(r.delivery_date))}</td>
      <td>${escapeHtml(r.company_name)}</td>
      <td>${escapeHtml(r.route_name)}</td>
      <td>${escapeHtml(r.driver_name)}</td>
      <td>${escapeHtml(r.driver_phone || '')}</td>
      <td>${escapeHtml(r.vehicle_plate)}</td>
      <td>${photoCount}/4</td>
      <td>${escapeHtml(r.memo || '')}</td>
      <td class="${savedClass} text-xs">${savedText}</td>
      <td class="text-right">
        <button class="btn btn-ghost text-xs text-rose-400" data-del="${i}">삭제</button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  tbody.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const idx = Number(btn.dataset.del);
      await deleteOneRow(idx);
    });
  });
}

async function deleteOneRow(idx) {
  const row = state.rows[idx];
  if (!row) return;

  const ok = await confirmDialog(
    '이 행을 삭제할까요?',
    { okText: '삭제', cancelText: '취소', danger: true }
  );

  if (!ok) return;

  if (row.id) {
    const { error } = await supabase
      .from('transfer_deliveries')
      .delete()
      .eq('center_code', selectedCenter.code)
      .eq('id', row.id);

    if (error) {
      toast(`DB 삭제 실패: ${error.message}`, 'error');
      return;
    }
  }

  state.rows.splice(idx, 1);
  renderRows();
  toast('삭제했습니다.', 'success');
}

async function deleteSelectedRows() {
  const checked = [...document.querySelectorAll('.row-check:checked')];

  if (checked.length === 0) {
    toast('삭제할 행을 선택하세요.', 'warn');
    return;
  }

  const ok = await confirmDialog(
    `선택한 ${checked.length}개 행을 삭제할까요? 저장된 행은 DB에서도 삭제됩니다.`,
    { okText: '삭제', cancelText: '취소', danger: true }
  );

  if (!ok) return;

  const indexes = checked
    .map(chk => Number(chk.dataset.idx))
    .filter(n => !Number.isNaN(n))
    .sort((a, b) => b - a);

  const dbIds = indexes
    .map(i => state.rows[i])
    .filter(Boolean)
    .map(r => r.id)
    .filter(Boolean);

  if (dbIds.length > 0) {
    const { error } = await supabase
      .from('transfer_deliveries')
      .delete()
      .eq('center_code', selectedCenter.code)
      .in('id', dbIds);

    if (error) {
      toast(`선택 삭제 실패: ${error.message}`, 'error');
      return;
    }
  }

  indexes.forEach(i => {
    state.rows.splice(i, 1);
  });

  renderRows();
  toast('선택한 행을 삭제했습니다.', 'success');
}

async function clearAllRows() {
  if (state.rows.length === 0) {
    toast('초기화할 항목이 없습니다.', 'warn');
    return;
  }

  const ok = await confirmDialog(
    '현재 목록 전체를 초기화할까요? 저장된 행은 DB에서도 삭제됩니다.',
    { okText: '전체 초기화', cancelText: '취소', danger: true }
  );

  if (!ok) return;

  const dbIds = state.rows.map(r => r.id).filter(Boolean);

  if (dbIds.length > 0) {
    const { error } = await supabase
      .from('transfer_deliveries')
      .delete()
      .eq('center_code', selectedCenter.code)
      .in('id', dbIds);

    if (error) {
      toast(`전체 초기화 실패: ${error.message}`, 'error');
      return;
    }
  }

  state.rows = [];
  renderRows();
  toast('전체 목록을 초기화했습니다.', 'success');
}

async function reloadDbRows() {
  const ok = await confirmDialog(
    'DB에서 다시 불러오면 현재 미저장 행은 사라질 수 있습니다. 계속할까요?',
    { okText: '새로고침', cancelText: '취소' }
  );

  if (!ok) return;

  await loadSavedRows();
  renderRows();
  toast('DB 목록을 다시 불러왔습니다.', 'success');
}

function clearForm() {
  $('f-company').value = '';
  refreshDependentSelects();

  $('f-center').value = selectedCenter.name;
  $('f-memo').value = '';
  $('f-phone').value = '';

  clearPhotos();
  setToday();
}

// -----------------------------------------------------------------------------
// 사진 입력 / 붙여넣기 / 드래그앤드롭
// -----------------------------------------------------------------------------
function bindPhotoInputs() {
  for (let i = 1; i <= 4; i++) {
    const input = $(`f-photo${i}`);

    input.addEventListener('change', async () => {
      const file = input.files?.[0];
      if (!file) return;

      try {
        const dataUrl = await compressImageToDataUrl(file, MAX_PHOTO_BYTES);
        setFormPhoto(i, dataUrl);
        toast(`${photoLabel(i)} 사진을 등록했습니다.`, 'success');
      } catch (err) {
        input.value = '';
        setFormPhoto(i, null);
        toast(err.message || '사진 처리 중 오류가 발생했습니다.', 'error');
      }
    });
  }

  document.querySelectorAll('.paste-zone').forEach(zone => {
    zone.addEventListener('click', () => {
      zone.focus();
    });

    zone.addEventListener('paste', async (e) => {
      const idx = Number(zone.dataset.photo);
      const file = getImageFileFromPasteEvent(e);

      if (!file) {
        toast('클립보드에 이미지가 없습니다.', 'warn');
        return;
      }

      e.preventDefault();

      try {
        const dataUrl = await compressImageToDataUrl(file, MAX_PHOTO_BYTES);
        setFormPhoto(idx, dataUrl);

        const input = $(`f-photo${idx}`);
        if (input) input.value = '';

        toast(`${photoLabel(idx)} 사진을 붙여넣었습니다.`, 'success');
      } catch (err) {
        setFormPhoto(idx, null);
        toast(err.message || '붙여넣은 사진 처리 중 오류가 발생했습니다.', 'error');
      }
    });

    zone.addEventListener('dragover', (e) => {
      e.preventDefault();
      zone.classList.add('border-emerald-500');
    });

    zone.addEventListener('dragleave', () => {
      zone.classList.remove('border-emerald-500');
    });

    zone.addEventListener('drop', async (e) => {
      e.preventDefault();
      zone.classList.remove('border-emerald-500');

      const idx = Number(zone.dataset.photo);
      const file = [...(e.dataTransfer?.files || [])]
        .find(f => f.type.startsWith('image/'));

      if (!file) {
        toast('이미지 파일을 넣어주세요.', 'warn');
        return;
      }

      try {
        const dataUrl = await compressImageToDataUrl(file, MAX_PHOTO_BYTES);
        setFormPhoto(idx, dataUrl);

        const input = $(`f-photo${idx}`);
        if (input) input.value = '';

        toast(`${photoLabel(idx)} 사진을 등록했습니다.`, 'success');
      } catch (err) {
        setFormPhoto(idx, null);
        toast(err.message || '사진 처리 중 오류가 발생했습니다.', 'error');
      }
    });
  });

  document.querySelectorAll('[data-clear-photo]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.clearPhoto);
      setFormPhoto(idx, null);

      const input = $(`f-photo${idx}`);
      if (input) input.value = '';

      toast(`${photoLabel(idx)} 사진을 삭제했습니다.`, 'info');
    });
  });
}

function getImageFileFromPasteEvent(e) {
  const items = e.clipboardData?.items;
  if (!items) return null;

  for (const item of items) {
    if (item.kind === 'file' && item.type.startsWith('image/')) {
      return item.getAsFile();
    }
  }

  return null;
}

function setFormPhoto(index, dataUrl) {
  state.formPhotos[index - 1] = dataUrl;

  const zone = document.querySelector(`.paste-zone[data-photo="${index}"]`);
  if (!zone) return;

  const preview = zone.querySelector('.photo-preview');
  if (!preview) return;

  if (!dataUrl) {
    preview.innerHTML = `
      <div class="text-xs text-zinc-500 text-center py-6">
        클릭 후 Ctrl+V로 붙여넣기
      </div>
    `;
    zone.classList.remove('border-emerald-500');
    return;
  }

  preview.innerHTML = `
    <div class="flex items-center gap-2">
      <img src="${dataUrl}" class="w-16 h-16 object-cover rounded border border-zinc-700">
      <div class="text-xs text-zinc-300">
        <div>${escapeHtml(photoLabel(index))}</div>
        <div class="text-zinc-500">${formatBytes(dataUrlBytes(dataUrl))}</div>
      </div>
    </div>
  `;
  zone.classList.add('border-emerald-500');
}

function clearPhotos() {
  state.formPhotos = [null, null, null, null];

  for (let i = 1; i <= 4; i++) {
    const input = $(`f-photo${i}`);
    if (input) input.value = '';
    setFormPhoto(i, null);
  }
}

function photoLabel(index) {
  return {
    1: '상차리스트',
    2: '상차사진',
    3: '추가파레트 1',
    4: '추가파레트 2'
  }[index] || `사진 ${index}`;
}

// -----------------------------------------------------------------------------
// DB 저장
// -----------------------------------------------------------------------------
async function saveDb() {
  if (state.rows.length === 0) {
    toast('저장할 항목이 없습니다.', 'warn');
    return;
  }

  const btn = $('btn-save-db');
  btn.disabled = true;
  const oldText = btn.textContent;
  btn.textContent = '저장 중...';

  try {
    const savedRows = [];

    for (const row of state.rows) {
      const payload = stateRowToPayload(row);

      if (row.id) {
        const { data, error } = await supabase
          .from('transfer_deliveries')
          .update(payload)
          .eq('center_code', selectedCenter.code)
          .eq('id', row.id)
          .select(`
            id,
            center,
            center_code,
            delivery_date,
            company_id,
            route_id,
            driver_id,
            vehicle_id,
            company_name,
            route_name,
            driver_name,
            driver_phone,
            vehicle_plate,
            photo1_data_url,
            photo2_data_url,
            photo3_data_url,
            photo4_data_url,
            memo,
            created_by,
            created_at,
            updated_at
          `)
          .single();

        if (error) throw error;
        savedRows.push(dbRowToStateRow(data));
      } else {
        const { data, error } = await supabase
          .from('transfer_deliveries')
          .insert(payload)
          .select(`
            id,
            center,
            center_code,
            delivery_date,
            company_id,
            route_id,
            driver_id,
            vehicle_id,
            company_name,
            route_name,
            driver_name,
            driver_phone,
            vehicle_plate,
            photo1_data_url,
            photo2_data_url,
            photo3_data_url,
            photo4_data_url,
            memo,
            created_by,
            created_at,
            updated_at
          `)
          .single();

        if (error) throw error;
        savedRows.push(dbRowToStateRow(data));
      }
    }

    state.rows = savedRows;
    renderRows();
    toast('DB에 저장했습니다.', 'success');
  } catch (err) {
    toast(`DB 저장 실패: ${err.message || err}`, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = oldText;
  }
}

// -----------------------------------------------------------------------------
// 엑셀 다운로드
// -----------------------------------------------------------------------------
async function downloadExcel() {
  if (state.rows.length === 0) {
    toast('다운로드할 항목이 없습니다.', 'warn');
    return;
  }

  if (!ExcelJSLib) {
    toast('ExcelJS 라이브러리를 불러오지 못했습니다.', 'error');
    return;
  }

  const btn = $('btn-download');
  btn.disabled = true;
  const oldText = btn.textContent;
  btn.textContent = '생성 중...';

  try {
    const res = await fetch(TEMPLATE_URL, { cache: 'no-store' });

    if (!res.ok) {
      throw new Error(`엑셀 템플릿을 불러오지 못했습니다. HTTP ${res.status}`);
    }

    const templateBuf = await res.arrayBuffer();

    const workbook = new ExcelJSLib.Workbook();
    await workbook.xlsx.load(templateBuf);

    const worksheet =
      workbook.getWorksheet('Sheet1 (2)') ||
      workbook.getWorksheet('Sheet1') ||
      workbook.worksheets[0];

    if (!worksheet) {
      throw new Error('엑셀 시트를 찾지 못했습니다.');
    }

    const startRow = 5;

    state.rows.forEach((item, index) => {
      const rowNum = startRow + index;

      if (index > 0) {
        copyRowStyle(worksheet, startRow, rowNum);
      }

      const row = worksheet.getRow(rowNum);

      if (!row.height || row.height < 80) {
        row.height = 90;
      }

      // 요청한 엑셀 위치
      // C: 센터
      // D: 일자
      // E: 소속
      // F: 코스
      // G: 기사명
      // H: 차량번호
      // I~L: 사진
      // M: 비고
      worksheet.getCell(`C${rowNum}`).value = item.center || '';
      worksheet.getCell(`D${rowNum}`).value = item.delivery_date || '';
      worksheet.getCell(`E${rowNum}`).value = item.company_name || '';
      worksheet.getCell(`F${rowNum}`).value = item.route_name || '';
      worksheet.getCell(`G${rowNum}`).value = item.driver_name || '';
      worksheet.getCell(`H${rowNum}`).value = item.vehicle_plate || '';
      worksheet.getCell(`M${rowNum}`).value = item.memo || '';

      // 사진은 각 셀 I/J/K/L에 셀 크기와 딱 맞게 삽입
      addImageToCell(workbook, worksheet, item.photos?.[0], 9, rowNum);   // I열
      addImageToCell(workbook, worksheet, item.photos?.[1], 10, rowNum);  // J열
      addImageToCell(workbook, worksheet, item.photos?.[2], 11, rowNum);  // K열
      addImageToCell(workbook, worksheet, item.photos?.[3], 12, rowNum);  // L열
    });

    const buf = await workbook.xlsx.writeBuffer();

    const blob = new Blob([buf], {
      type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
    });

    saveBlob(blob, buildFilename());
    toast('엑셀 파일을 다운로드했습니다.', 'success');
  } catch (err) {
    console.error(err);
    toast(`엑셀 다운로드 실패: ${err.message || err}`, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = oldText;
  }
}

function addImageToCell(workbook, worksheet, dataUrl, colNumber, rowNumber) {
  if (!dataUrl) return;

  const ext = dataUrl.startsWith('data:image/png') ? 'png' : 'jpeg';
  const base64 = dataUrl.includes(',') ? dataUrl.split(',')[1] : dataUrl;

  const imageId = workbook.addImage({
    base64,
    extension: ext
  });

  const colIndex = colNumber - 1;
  const rowIndex = rowNumber - 1;

  // 핵심 수정:
  // 여백 없이 현재 셀 경계 전체에 맞춤.
  // I5면 tl = I5 좌상단, br = J6 좌상단이므로 I5 셀 전체를 채움.
  worksheet.addImage(imageId, {
    tl: {
      col: colIndex,
      row: rowIndex
    },
    br: {
      col: colIndex + 1,
      row: rowIndex + 1
    },
    editAs: 'oneCell'
  });
}

function copyRowStyle(ws, fromRowNum, toRowNum) {
  const from = ws.getRow(fromRowNum);
  const to = ws.getRow(toRowNum);

  to.height = from.height;

  from.eachCell({ includeEmpty: true }, (cell, colNumber) => {
    const target = to.getCell(colNumber);

    target.style = clone(cell.style || {});
    target.numFmt = cell.numFmt;
    target.alignment = cell.alignment ? clone(cell.alignment) : undefined;
    target.border = cell.border ? clone(cell.border) : undefined;
    target.fill = cell.fill ? clone(cell.fill) : undefined;
    target.font = cell.font ? clone(cell.font) : undefined;
    target.protection = cell.protection ? clone(cell.protection) : undefined;
  });

  to.commit?.();
}

// -----------------------------------------------------------------------------
// 이미지 압축
// -----------------------------------------------------------------------------
async function compressImageToDataUrl(file, maxBytes) {
  if (!file.type.startsWith('image/')) {
    throw new Error('이미지 파일만 첨부할 수 있습니다.');
  }

  const img = await fileToImage(file);

  let maxSide = 1600;
  let quality = 0.85;

  for (let attempt = 0; attempt < 12; attempt++) {
    const { width, height } = fitSize(img.width, img.height, maxSide);

    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;

    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, width, height);

    const dataUrl = canvas.toDataURL('image/jpeg', quality);
    const bytes = dataUrlBytes(dataUrl);

    if (bytes <= maxBytes) return dataUrl;

    if (quality > 0.45) {
      quality -= 0.1;
    } else {
      maxSide = Math.floor(maxSide * 0.85);
    }
  }

  throw new Error('사진을 1MB 이하로 압축하지 못했습니다.');
}

function fileToImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();

    img.onload = () => {
      URL.revokeObjectURL(url);
      resolve(img);
    };

    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('이미지를 읽지 못했습니다.'));
    };

    img.src = url;
  });
}

function fitSize(w, h, maxSide) {
  const ratio = Math.min(1, maxSide / Math.max(w, h));
  return {
    width: Math.round(w * ratio),
    height: Math.round(h * ratio)
  };
}

function dataUrlBytes(dataUrl) {
  const base64 = dataUrl.split(',')[1] || '';
  return Math.ceil(base64.length * 3 / 4);
}

// -----------------------------------------------------------------------------
// 다운로드 / 포맷 / 유틸
// -----------------------------------------------------------------------------
function buildFilename() {
  const custom = $('f-filename').value.trim();

  if (custom) {
    return custom.endsWith('.xlsx') ? custom : `${custom}.xlsx`;
  }

  const d = new Date();
  const ymd =
    `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;

  return `이배송_${ymd}.xlsx`;
}

function saveBlob(blob, filename) {
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = filename;

  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function formatDateKr(dateStr) {
  if (!dateStr) return '';

  const d = new Date(dateStr + 'T00:00:00');
  if (Number.isNaN(d.getTime())) return dateStr;

  return `${d.getMonth() + 1}월${d.getDate()}일`;
}

function formatBytes(bytes) {
  if (bytes == null || Number.isNaN(bytes)) return '';

  if (bytes < 1024) return `${bytes}B`;
  if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)}KB`;

  return `${(bytes / 1024 / 1024).toFixed(2)}MB`;
}

function makeUid() {
  if (crypto?.randomUUID) {
    return crypto.randomUUID();
  }

  return `uid_${Date.now()}_${Math.random().toString(16).slice(2)}`;
}

function clone(obj) {
  return JSON.parse(JSON.stringify(obj || {}));
}

function escapeHtml(s) {
  return String(s ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'",'&#39;');
}
