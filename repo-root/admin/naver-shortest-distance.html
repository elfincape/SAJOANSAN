<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>네이버 최단거리 계산</title><link rel="stylesheet" href="/css/common.css"><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script type="module" src="/js/exceljs-global.js"></script><style>[hidden]{display:none!important}.panel{border:1px solid #3f3f46;border-radius:12px;padding:20px;background:#18181b}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.fields label{display:grid;gap:6px}.origin{grid-column:1/-1}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.scroll{overflow:auto;max-height:600px}.app-table td{white-space:nowrap}.longest{background:#ffeb3b!important;color:#18181b!important;font-weight:700}.btn:disabled{opacity:.45}#status{color:#a1a1aa}</style><link rel="stylesheet" href="/css/workspace-ui.css">
<link rel="stylesheet" href="/css/admin-workspace.css">
<script type="module" src="/js/admin-workspace.js"></script>
<link rel="stylesheet" href="/css/theme.css">
<script type="module" src="/js/theme.js"></script>
<style>#relations-panel{border-radius:8px}#relations-panel label,#relations-panel input,#relations-panel select{min-width:0;max-width:100%}#relation-source-label,#relation-count,#relation-status{overflow-wrap:anywhere}#relations-panel td{white-space:normal;min-width:110px;max-width:280px;overflow-wrap:anywhere}#relation-issue-list{max-height:240px;overflow:auto}[data-distance-mode][aria-selected="true"]{color:var(--app-accent,#059669);border-color:currentColor}</style>
</head><body class="workspace-ui work-shell bg-zinc-900 text-zinc-100 min-h-screen"><header class="border-b border-zinc-800"><div class="max-w-[1400px] mx-auto px-4 py-3 toolbar"><a href="/admin/?center=pyeongtaek" class="btn btn-ghost">관리 허브</a><h1 class="font-semibold">네이버 최단거리 계산</h1></div></header><main class="max-w-[1400px] mx-auto px-4 py-6 space-y-5">
<div class="toolbar" role="tablist" aria-label="거리 조회 방식"><button id="distance-mode" data-distance-mode="distance" class="btn btn-ghost" role="tab" aria-selected="true">착지별 거리</button><button id="relation-mode" data-distance-mode="relations" class="btn btn-ghost" role="tab" aria-selected="false" hidden>평택 배차 구간</button></div>
<section id="relations-panel" class="panel space-y-4" role="tabpanel" aria-labelledby="relation-mode" hidden>
<div class="toolbar"><h2 class="font-semibold">평택 배차 구간</h2><span id="relation-source-label" class="text-sm text-zinc-400">평택 납품처 DB</span></div>
<div class="fields"><label class="origin">센터 출발지<input id="relation-origin" class="app-input" maxlength="300" value="경기도 평택시 산단로 263"></label><label>착지별 후보 수<input id="relation-limit" class="app-input" type="number" min="1" max="50" step="1" value="50"></label><label>도로 조회 한도<select id="relation-budget" class="app-select"><option value="60">시험 · 60건</option><option value="1000">1,000건</option><option value="25000">25,000건</option></select></label><label>물량표·납품정보<input id="relation-files" class="app-input" type="file" accept=".xlsx,.xls,.csv" multiple></label></div>
<div class="toolbar"><button id="relation-use-db" class="btn btn-ghost">DB 선택</button><button id="relation-preview" class="btn btn-ghost">후보 확인</button><button id="relation-start" class="btn btn-primary" disabled>수집 시작</button><button id="relation-restore" class="btn btn-ghost">최근 작업</button><button id="relation-resume" class="btn btn-primary" disabled>재개</button><button id="relation-stop" class="btn btn-ghost" hidden>중지</button><button id="relation-download" class="btn btn-ghost" disabled>구간 다운로드</button></div>
<p id="relation-status" role="status" aria-live="polite"></p><p id="relation-count" class="text-sm text-zinc-400"></p><p id="relation-allowance" class="text-sm text-zinc-400">네이버 계정의 무료 잔여량 미확인</p>
<details id="relation-issues" hidden><summary>주소 확인 필요</summary><ul id="relation-issue-list"></ul></details>
<details><summary>구간 추가 조회</summary><div class="fields"><label>출발 주소<input id="relation-pair-from" class="app-input" maxlength="300"></label><label>도착 주소<input id="relation-pair-to" class="app-input" maxlength="300"></label></div><button id="relation-pair" class="btn btn-ghost">구간 조회·저장</button><p id="relation-pair-status" role="status" aria-live="polite"></p></details>
<div class="scroll"><table class="app-table"><thead><tr><th>출발</th><th>도착</th><th>선정 기준</th><th>도로 거리(km)</th><th>이동시간(분)</th><th>측정 시각</th><th>상태</th></tr></thead><tbody id="relation-results"></tbody></table></div>
</section>
<section class="panel fields">
<label class="origin">출발지 주소<input id="origin" class="app-input" value="경기도 평택시 산단로 263" maxlength="300"></label>
<label>1톤 연비 (km/L)<input data-efficiency="1" class="app-input" type="number" min="0.1" step="0.1" value="8.3"></label><label>2.5톤 연비 (km/L)<input data-efficiency="2.5" class="app-input" type="number" min="0.1" step="0.1" value="6.7"></label><label>3.5톤 연비 (km/L)<input data-efficiency="3.5" class="app-input" type="number" min="0.1" step="0.1" value="6"></label><label>5톤 연비 (km/L)<input data-efficiency="5" class="app-input" type="number" min="0.1" step="0.1" value="4.8"></label><label>11톤 이상 연비 (km/L)<input data-efficiency="11" class="app-input" type="number" min="0.1" step="0.1" value="4"></label>
</section><section class="panel space-y-4"><div class="fields"><label>안산 출발지<input id="origin-001" class="app-input" value="경기도 안산시 단원구 성곡로 125"></label><label>평택 출발지<input id="origin-002" class="app-input" value="경기도 평택시 산단로 263"></label></div><div class="toolbar"><button id="center-001" class="btn btn-primary">안산계산</button><button id="center-002" class="btn btn-primary">평택계산</button></div></section><section class="panel space-y-4"><div class="fields"><label class="origin">엑셀 파일<input id="file" type="file" accept=".xlsx,.xls,.csv" class="app-input"></label><label>시트<select id="sheet" class="app-select"></select></label><label>주소 열<select id="address-column" class="app-select"></select></label><label>착지명 열<select id="name-column" class="app-select"><option value="">선택 안 함</option></select></label><label>데이터 시작 행<input id="start-row" class="app-input" type="number" min="1" step="1" value="1"></label></div><div class="toolbar"><button id="restore-job" class="btn btn-ghost">최근 작업 불러오기</button><button id="calculate" class="btn btn-primary" disabled>최단거리 계산</button><button id="cancel" class="btn btn-ghost" hidden>계산 중지</button><button id="download" class="btn btn-ghost ml-auto" disabled>엑셀 다운로드</button></div><p id="status" role="status" aria-live="polite">로그인 확인 중</p></section><section class="panel space-y-4"><p id="source-label"></p><p id="count"></p><div class="scroll"><table id="results" class="app-table"><thead><tr><th>원본행</th><th>착지명</th><th>주소</th><th>권역</th><th>주행거리(km)</th><th>1톤 유류량(L)</th><th>2.5톤 유류량(L)</th><th>3.5톤 유류량(L)</th><th>5톤 유류량(L)</th><th>11톤 이상 유류량(L)</th><th>확인 필요</th><th>네이버 표시거리</th><th>측정일시</th></tr></thead><tbody></tbody></table></div><div class="toolbar"><button id="prev" class="btn btn-ghost">이전</button><span id="page"></span><button id="next" class="btn btn-ghost">다음</button></div></section></main><script type="module" src="/js/naver-browser-ui.js"></script><script type="module" src="/js/naver-relations-ui.js"></script></body></html>
