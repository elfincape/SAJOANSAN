<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>설정 · 관리 허브</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .feature-switch{position:relative;width:60px;height:36px;min-height:36px;border:0;border-radius:999px;background:var(--theme-muted);transition:background-color .2s;cursor:pointer;flex:none}
    .feature-switch::after{content:"";position:absolute;top:50%;left:6px;width:24px;height:24px;transform:translateY(-50%);border-radius:50%;background:#fff;box-shadow:0 1px 3px #0008;transition:transform .2s}
    .feature-switch[aria-checked="true"]{background:#059669}
    .feature-switch[aria-checked="true"]::after{transform:translate(24px,-50%)}
    .feature-switch:focus-visible{outline:3px solid #34d399;outline-offset:3px}
    .feature-panel{overflow:hidden;border:1px solid var(--theme-border);border-radius:.75rem;background:var(--theme-panel)}
    .feature-row{display:flex;align-items:center;gap:1rem;padding:.8rem 1rem}
    .feature-row+.feature-row{border-top:1px solid var(--theme-border)}
    .feature-label{flex:1;min-width:0;font-size:.875rem;font-weight:500}
    .feature-description,.feature-help{font-size:13px;line-height:1.6;color:var(--theme-muted)}
    .feature-help{margin:16px 0}
    .feature-description{margin-top:4px}
    .feature-state{font-size:13px;color:var(--theme-muted);white-space:nowrap}
    .feature-toolbar{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:24px 0}
    .feature-toolbar label{flex:1;min-width:180px}
    #feature-groups h3{font-size:15px;font-weight:650;margin:24px 0 10px}
    .feature-row[hidden]{display:none}
    @media(max-width:520px){.feature-row{gap:.65rem}.feature-state{display:none}.feature-switch{height:44px;min-height:44px}}
  </style>
<link rel="stylesheet" href="/css/workspace-ui.css">
<link rel="stylesheet" href="/css/admin-workspace.css">
<script type="module" src="/js/admin-workspace.js"></script>
<link rel="stylesheet" href="/css/theme.css">
<script type="module" src="/js/theme.js"></script>
</head>
<body class="workspace-ui work-shell bg-zinc-900 text-zinc-100 min-h-screen flex flex-col">
  <header class="border-b border-zinc-800">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-4">
      <h1 class="text-base font-semibold">설정</h1>
      <div class="flex-1"></div>
      <a href="/admin/" class="btn btn-ghost">관리 허브</a>
      <button id="logout-btn" class="btn btn-ghost">로그아웃</button>
    </div>
  </header>
  <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-8">
    <div class="flex flex-wrap items-center gap-2 mb-6">
      <h2 class="text-lg font-semibold mr-auto" style="font-size:20px">관리 허브 기능 표시</h2>
      <button id="enable-all" class="btn btn-ghost">검색 결과 켜기</button>
      <button id="disable-all" class="btn btn-ghost">검색 결과 끄기</button>
    </div>
    <p class="feature-help">현재 브라우저의 메뉴 표시 설정입니다. 사용자 권한과는 별개이며, 기능을 켜도 접근 권한은 추가되지 않습니다. 기능이 등록되면 이 목록에도 함께 반영됩니다.</p>
    <div class="feature-toolbar">
      <label for="feature-search">기능 검색<input id="feature-search" type="search" class="app-input" placeholder="기능 이름·센터·설명 검색"></label>
      <span id="feature-count" role="status" aria-live="polite"></span>
      <button id="reset-defaults" class="btn btn-ghost">기본값 복원</button>
    </div>
    <div id="feature-groups" class="space-y-6"></div>
    <p id="feature-empty" hidden>검색에 맞는 기능이 없습니다.</p>
    <p class="feature-help">설정과 페이지별 권한 메뉴는 복구를 위해 항상 유지됩니다. 표시 설정은 이 계정의 현재 브라우저에 저장되며 다른 기기·다른 사용자에게는 적용되지 않습니다.</p>
    <p id="save-status" class="text-xs text-emerald-400 mt-5 min-h-5" aria-live="polite"></p>
  </main>
  <script type="module" src="/js/admin-settings.js"></script>
</body>
</html>
