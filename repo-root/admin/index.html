<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>관리 허브 · 코스표 관리 시스템</title>
  <link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/workspace-ui.css">
<link rel="stylesheet" href="/css/admin-workspace.css">
<script type="module" src="/js/admin-workspace.js"></script>
<link rel="stylesheet" href="/css/theme.css">
<script type="module" src="/js/theme.js"></script>
</head>
<body class="workspace-ui work-shell bg-zinc-900 text-zinc-100 min-h-screen flex flex-col">

  <!-- 헤더 -->
  <header class="border-b border-zinc-800">
    <div class="max-w-[1200px] mx-auto px-4 py-3 flex items-center gap-4">
      <div class="flex items-center gap-2 min-w-0">
        <div class="w-8 h-8 rounded-md bg-emerald-600/20 border border-emerald-600/40 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-emerald-400"
               fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3 7h11v8H3zM14 10h4l3 3v2h-7zM6.5 18a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM17.5 18a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/>
          </svg>
        </div>
        <h1 class="text-base font-semibold">관리 허브</h1>
      </div>
      <div class="flex-1"></div>
      <span id="user-badge" class="text-xs text-zinc-400 hidden sm:inline"></span>
      <a href="/" class="btn btn-ghost">대시보드</a>
      <button id="logout-btn" class="btn btn-ghost">로그아웃</button>
    </div>
  </header>

  <!-- 본문 -->
  <main class="flex-1 max-w-[1200px] w-full mx-auto px-4 py-8">
    <div class="hub-heading">
      <h2>관리 도구</h2>
      <p></p>
    </div>
    <section class="hub-controls" aria-label="관리 도구 찾기">
      <div class="hub-search">
        <label for="menu-search">도구 검색</label>
        <input id="menu-search" type="search" placeholder="코스, 기사, 엑셀 등 도구 이름 검색" autocomplete="off" aria-controls="menu-grid">
      </div>
      <div id="hub-categories" class="hub-categories" role="group" aria-label="도구 분류">
        <button type="button" data-hub-category="all" aria-pressed="true">전체</button>
        <button type="button" data-hub-category="work" aria-pressed="false">업무 처리</button>
        <button type="button" data-hub-category="reference" aria-pressed="false">기준정보</button>
        <button type="button" data-hub-category="files" aria-pressed="false">파일 도구</button>
        <button type="button" data-hub-category="system" aria-pressed="false">시스템</button>
      </div>
    </section>
    <p id="hub-result-count" class="hub-result-count" role="status" aria-live="polite"></p>
    <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    <div id="hub-empty" class="hub-empty" hidden>
      <h2>조건에 맞는 도구가 없습니다</h2>
      <p>검색어를 바꾸거나 전체 도구에서 다시 찾아보세요.</p>
      <button id="hub-reset" type="button" class="btn">검색·분류 초기화</button>
    </div>
  </main>

  <script type="module">
    import { requireRole, signOut } from '/js/auth.js';
    import {
      decorateCenterLinks,
      forceCenterSelectionFromUrl,
      mountHeaderCenterSwitcher,
      requireSelectedCenter,
      withCenterParam
    } from '/js/center.js';
    import { getAdminMenus } from '/js/admin-menu.js';
    import { mountAdminHub } from '/js/admin-hub.js';

    const profile = await requireRole('editor');
    if (!profile) { /* 리다이렉트 됨 */ }

    document.getElementById('user-badge').textContent =
      `${profile.display_name || profile.email || ''} (${profile.role})`;
    const center = await requireSelectedCenter({ force: forceCenterSelectionFromUrl() });
    mountHeaderCenterSwitcher(next => location.replace(withCenterParam('/admin/', next)));
    document.querySelector('a[href="/"]').href = withCenterParam('/', center);
    document.getElementById('logout-btn').addEventListener('click', signOut);

    const menus = getAdminMenus(profile);

    const grid = document.getElementById('menu-grid');
    grid.innerHTML = menus.map(m => {
      return `
        <a href="${withCenterParam(m.href, m.fixedCenter ? {slug:m.fixedCenter} : center)}"
           ${m.fixedCenter ? 'data-fixed-center="true"' : ''}
           class="group block rounded-lg border border-zinc-700 bg-zinc-800/40 hover:bg-zinc-800
                  hover:border-zinc-600 transition p-4">
          <h3 class="text-sm font-semibold app-function-title">${m.title}</h3>
          ${m.desc ? `<p class="text-xs text-zinc-400 mt-0.5">${m.desc}</p>` : ''}
        </a>
      `;
    }).join('');
    decorateCenterLinks(grid, center);
    mountAdminHub(grid);

  </script>
</body>
</html>
