<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>납품처 관리 · 코스표 관리 시스템</title>
  <link rel="stylesheet" href="/css/common.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-900 text-zinc-100 min-h-screen flex flex-col">

  <!-- 헤더 -->
  <header class="border-b border-zinc-800 sticky top-0 z-30 bg-zinc-900/95 backdrop-blur">
    <div class="max-w-[1600px] mx-auto px-4 py-3 flex items-center gap-3">
      <a href="/admin/" class="text-xs text-zinc-400 hover:text-zinc-100">← 관리 허브</a>
      <h1 class="text-base font-semibold">납품처 관리</h1>
      <div class="flex-1"></div>
      <span id="user-badge" class="text-xs text-zinc-400 hidden sm:inline"></span>
      <a href="/" class="btn btn-ghost">대시보드</a>
    </div>
  </header>

  <!-- 본문: 좌측 목록 / 우측 폼 -->
  <main class="flex-1 max-w-[1600px] w-full mx-auto px-4 py-3">
    <div class="grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_minmax(420px,520px)] gap-4">

      <!-- ===== 좌측: 목록 ===================================== -->
      <section class="border border-zinc-700 rounded-lg overflow-hidden flex flex-col"
               style="min-height: 70vh;">
        <div class="p-3 border-b border-zinc-700 bg-zinc-800/50 flex flex-wrap gap-2 items-center">
          <input id="search-input" type="search" placeholder="코드/이름/주소 검색"
                 class="app-input flex-1 min-w-[180px]">
          <select id="filter-region" class="app-select w-32">
            <option value="">지역(전체)</option>
          </select>
          <select id="filter-method" class="app-select w-32">
            <option value="">납품방식(전체)</option>
            <option value="대면">대면</option>
            <option value="검수">검수</option>
            <option value="무인">무인</option>
          </select>
          <select id="sort-key" class="app-select w-28">
            <option value="code">코드순</option>
            <option value="name">이름순</option>
          </select>
          <button id="new-btn" class="btn btn-primary">+ 신규</button>
        </div>

        <div class="table-wrap" style="max-height: calc(100vh - 220px); border: none; border-radius: 0;">
          <table class="app-table">
            <thead>
              <tr>
                <th>코드</th>
                <th>이름</th>
                <th>지역</th>
                <th>납품방식</th>
                <th>마감</th>
              </tr>
            </thead>
            <tbody id="dp-tbody"></tbody>
          </table>
          <div id="empty-msg" class="hidden text-center text-sm text-zinc-500 py-12">
            조건에 맞는 납품처가 없습니다.
          </div>
        </div>

        <div class="px-3 py-2 border-t border-zinc-700 text-xs text-zinc-400 flex items-center justify-between">
          <span id="result-count"></span>
          <span id="loading-indicator" class="hidden">불러오는 중...</span>
        </div>
      </section>

      <!-- ===== 우측: 폼 ===================================== -->
      <section class="border border-zinc-700 rounded-lg bg-zinc-800/30">
        <div class="px-4 py-3 border-b border-zinc-700 flex items-center gap-3">
          <h2 id="form-title" class="text-sm font-semibold">새 납품처</h2>
          <span id="form-mode-badge" class="text-[10px] px-1.5 py-0.5 rounded bg-zinc-700 text-zinc-300">신규</span>
          <div class="flex-1"></div>
          <span id="form-meta" class="text-[11px] text-zinc-500"></span>
        </div>

        <form id="dp-form" class="p-4 space-y-4" novalidate>
          <input type="hidden" id="f-id">

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="app-label">코드</label>
              <input id="f-code" class="app-input" placeholder="예: A001">
            </div>
            <div>
              <label class="app-label">이름 *</label>
              <input id="f-name" class="app-input" required>
            </div>
          </div>

          <div>
            <label class="app-label">주소</label>
            <div class="flex gap-2">
              <input id="f-address" class="app-input flex-1">
              <button type="button" id="btn-extract-region" class="btn btn-ghost text-xs whitespace-nowrap">지역 자동추출</button>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="app-label">지역</label>
              <input id="f-region" class="app-input" placeholder="예: 서울 강남구">
            </div>
            <div>
              <label class="app-label">납품마감</label>
              <input id="f-deadline" class="app-input biz-time" placeholder="예: 22:00 또는 25:30">
              <p class="text-[10px] text-zinc-500 mt-1">04:00~27:59 범위. 비워두면 마감 없음.</p>
            </div>
          </div>

          <fieldset>
            <legend class="app-label">진입조건 (가능 여부)</legend>
            <div class="grid grid-cols-2 gap-1.5">
              <label class="cb"><input type="checkbox" id="f-1ton">    1톤 이하</label>
              <label class="cb"><input type="checkbox" id="f-3_5ton">  3.5톤 이하</label>
              <label class="cb"><input type="checkbox" id="f-5ton">    5톤 이상</label>
              <label class="cb"><input type="checkbox" id="f-yard">    무인 야적</label>
            </div>
          </fieldset>

          <div class="grid grid-cols-3 gap-3">
            <fieldset>
              <legend class="app-label">납품방식</legend>
              <div class="space-y-1">
                <label class="cb"><input type="radio" name="dmethod" value="대면"> 대면</label>
                <label class="cb"><input type="radio" name="dmethod" value="검수"> 검수</label>
                <label class="cb"><input type="radio" name="dmethod" value="무인"> 무인</label>
                <label class="cb text-zinc-500"><input type="radio" name="dmethod" value=""> 미지정</label>
              </div>
            </fieldset>
            <fieldset>
              <legend class="app-label">진입방식</legend>
              <div class="space-y-1">
                <label class="cb"><input type="radio" name="amethod" value="보안키"> 보안키</label>
                <label class="cb"><input type="radio" name="amethod" value="열쇠">   열쇠</label>
                <label class="cb"><input type="radio" name="amethod" value="없음">   없음</label>
                <label class="cb text-zinc-500"><input type="radio" name="amethod" value=""> 미지정</label>
              </div>
            </fieldset>
            <fieldset>
              <legend class="app-label">납품장소</legend>
              <div class="space-y-1">
                <label class="cb"><input type="radio" name="dloc" value="창고"> 창고</label>
                <label class="cb"><input type="radio" name="dloc" value="탑차"> 탑차</label>
                <label class="cb"><input type="radio" name="dloc" value="야적"> 야적</label>
                <label class="cb text-zinc-500"><input type="radio" name="dloc" value=""> 미지정</label>
              </div>
            </fieldset>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="app-label">열쇠보관장소</label>
              <input id="f-security-key-location" class="app-input" placeholder="예: 경비실, 출입문 상단, 키박스">
            </div>
            <div>
              <label class="app-label">비밀번호</label>
              <input id="f-security-password" class="app-input" placeholder="보안키/키박스/출입문 비밀번호">
            </div>
          </div>

          <div class="divider"></div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="app-label">대표자명</label>
              <input id="f-rep-name" class="app-input">
            </div>
            <div>
              <label class="app-label">대표번호</label>
              <input id="f-rep-phone" class="app-input" placeholder="예: 02-1234-5678">
            </div>
            <div>
              <label class="app-label">담당자명</label>
              <input id="f-mgr-name" class="app-input">
            </div>
            <div>
              <label class="app-label">담당자 사무실</label>
              <input id="f-mgr-office" class="app-input">
            </div>
            <div class="col-span-2">
              <label class="app-label">담당자 휴대폰</label>
              <input id="f-mgr-mobile" class="app-input">
            </div>
          </div>

          <div class="space-y-2">
            <div class="flex items-center justify-between gap-2">
              <label class="app-label mb-0">납품처 사진</label>
              <span id="f-photo-count" class="text-[11px] text-zinc-500">0/6</span>
            </div>
            <div id="f-photo-dropzone" tabindex="0" class="flex min-h-28 flex-col items-center justify-center rounded-lg border border-dashed border-zinc-600 bg-zinc-900/40 px-3 py-4 text-center text-xs text-zinc-400 hover:border-emerald-500 hover:text-emerald-200 focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500">
              <input id="f-photo-input" type="file" accept="image/*,.jpg,.jpeg,.png,.webp,.gif" multiple class="hidden">
              <span class="font-semibold text-zinc-200">이미지 붙여넣기</span>
              <span class="mt-1 text-emerald-300">이 영역을 클릭한 뒤 Ctrl+V로 사진을 붙여넣으세요.</span>
              <span class="mt-1">최대 6장 · HD(1280×720 이내) · 장당 1MB 이하 자동 압축</span>
              <label for="f-photo-input" class="btn btn-ghost mt-3 text-xs">파일 선택</label>
            </div>
            <div id="f-photo-grid" class="grid grid-cols-3 gap-2"></div>
          </div>

          <div>
            <label class="app-label">비고</label>
            <textarea id="f-memo" rows="2" class="app-textarea"></textarea>
          </div>

          <div class="flex items-center gap-2 pt-2 border-t border-zinc-700">
            <button type="submit" id="btn-save" class="btn btn-primary">저장</button>
            <button type="button" id="btn-cancel" class="btn btn-ghost">취소</button>
            <div class="flex-1"></div>
            <button type="button" id="btn-delete" class="btn btn-danger hidden">삭제</button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <script type="module">
    import { supabase } from '/js/supabase.js';
    import { requireRole, getCurrentProfile } from '/js/auth.js';
    import { bizMinToDisplay, displayToBizMin } from '/js/time.js';
    import { toast, confirmDialog, formatPhone } from '/js/ui.js';
    import { centerPayload, decorateCenterLinks, forceCenterSelectionFromUrl, getRequiredCenter, mountHeaderCenterSwitcher, requireSelectedCenter, scopeByCenter, withCenterParam } from '/js/center.js';

    // -------------------------------------------------------------------------
    // 컬럼 / 스키마 매핑
    //   ※ 컨텍스트의 delivery_points 필드 + 추가 연락처 필드를 확장 매핑한다.
    //     스키마에 contact_name / contact_office / contact_mobile / rep_name /
    //     rep_phone / security_key_location / security_password 컬럼이 없다면
    //     마이그레이션이 필요할 수 있다 (하단 메모 참고).
    // -------------------------------------------------------------------------

    // -------------------------------------------------------------------------
    // 권한
    // -------------------------------------------------------------------------
    const profile = await requireRole('editor');
    if (!profile) { /* 리다이렉트 */ }
    await requireSelectedCenter({ force: forceCenterSelectionFromUrl() });
    mountHeaderCenterSwitcher(next => location.replace(withCenterParam(location.pathname + location.search, next)));
    decorateCenterLinks(document);
    document.getElementById('user-badge').textContent =
      `${profile.display_name || profile.email || ''} (${profile.role})`;

    // -------------------------------------------------------------------------
    // 상태
    // -------------------------------------------------------------------------
    const state = {
      rows: [],
      filtered: [],
      selectedId: null,
      filters: { search: '', region: '', method: '' },
      sort: 'code',
      draftPhotos: []
    };

    // DOM 캐시
    const $ = (id) => document.getElementById(id);
    const tbody = $('dp-tbody');

    // -------------------------------------------------------------------------
    // 부트
    // -------------------------------------------------------------------------
    bindEvents();
    await loadList();
    resetForm();

    // -------------------------------------------------------------------------
    // 목록 로드
    // -------------------------------------------------------------------------
    async function loadList() {
      $('loading-indicator').classList.remove('hidden');
      try {
        const { data, error } = await scopeByCenter(
          supabase.from('delivery_points').select('*')
        );
        if (error) throw error;
        state.rows = data || [];
        // 지역 필터 옵션 채우기
        const regions = [...new Set(state.rows.map(r => r.region).filter(Boolean))]
          .sort((a, b) => a.localeCompare(b, 'ko'));
        const sel = $('filter-region');
        const cur = sel.value;
        sel.innerHTML = '<option value="">지역(전체)</option>' +
          regions.map(r => `<option value="${escapeAttr(r)}">${escapeHtml(r)}</option>`).join('');
        sel.value = cur;
      } catch (e) {
        toast('납품처 목록을 불러오지 못했습니다.', 'error');
        state.rows = [];
      } finally {
        $('loading-indicator').classList.add('hidden');
      }
      applyAndRender();
    }

    function applyAndRender() {
      const f = state.filters;
      const q = f.search.toLowerCase();
      state.filtered = state.rows.filter(r => {
        if (f.region && r.region !== f.region) return false;
        if (f.method && r.delivery_method !== f.method) return false;
        if (q) {
          const hay = [r.code, r.name, r.address, r.security_key_location, r.security_password].filter(Boolean).join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
      const key = state.sort === 'name' ? 'name' : 'code';
      state.filtered.sort((a, b) => String(a[key] ?? '').localeCompare(String(b[key] ?? ''), 'ko', { numeric: true }));
      renderList();
    }

    function renderList() {
      tbody.innerHTML = '';
      const empty = $('empty-msg');
      if (state.filtered.length === 0) {
        empty.classList.remove('hidden');
      } else {
        empty.classList.add('hidden');
        const frag = document.createDocumentFragment();
        for (const r of state.filtered) {
          const tr = document.createElement('tr');
          tr.dataset.id = r.id;
          if (r.id === state.selectedId) tr.classList.add('selected');
          tr.classList.add('cursor-pointer');
          tr.innerHTML = `
            <td>${escapeHtml(r.code || '')}</td>
            <td>${escapeHtml(r.name || '')}</td>
            <td>${escapeHtml(r.region || '')}</td>
            <td>${escapeHtml(r.delivery_method || '')}</td>
            <td class="biz-time">${escapeHtml(bizMinToDisplay(r.deadline_business_min))}</td>
          `;
          tr.addEventListener('click', () => selectRow(r.id));
          frag.appendChild(tr);
        }
        tbody.appendChild(frag);
      }
      $('result-count').textContent =
        state.rows.length === 0 ? '데이터 없음'
        : (state.filtered.length === state.rows.length
            ? `총 ${state.rows.length}건`
            : `총 ${state.filtered.length}건 (전체 ${state.rows.length}건 중)`);
    }

    // -------------------------------------------------------------------------
    // 폼 ↔ 객체 변환
    // -------------------------------------------------------------------------
    function rowToForm(r) {
      $('f-id').value             = r?.id || '';
      $('f-code').value           = r?.code || '';
      $('f-name').value           = r?.name || '';
      $('f-address').value        = r?.address || '';
      $('f-region').value         = r?.region || '';
      $('f-deadline').value       = r?.deadline_text || (r?.deadline_business_min != null ? bizMinToDisplay(r.deadline_business_min) : '');

      $('f-1ton').checked   = !!r?.allow_under_1ton;
      $('f-3_5ton').checked = !!r?.allow_under_3_5ton;
      $('f-5ton').checked   = !!r?.allow_over_5ton;
      $('f-yard').checked   = !!r?.allow_unmanned_yard;

      setRadio('dmethod', r?.delivery_method || '');
      setRadio('amethod', r?.access_method   || '');
      setRadio('dloc',    r?.delivery_location || '');

      $('f-security-key-location').value = r?.security_key_location || '';
      $('f-security-password').value     = r?.security_password || '';

      $('f-rep-name').value    = r?.rep_name      || '';
      $('f-rep-phone').value   = r?.rep_phone     || '';
      $('f-mgr-name').value    = r?.contact_name  || '';
      $('f-mgr-office').value  = r?.contact_office|| '';
      $('f-mgr-mobile').value  = r?.contact_mobile || r?.contact || '';
      $('f-memo').value        = r?.memo || '';
      state.draftPhotos = parseDeliveryPointPhotos(r?.photos);
      renderFormPhotos();

      // 헤더
      const isEdit = !!r?.id;
      $('form-title').textContent = isEdit ? (r.name || '(이름 없음)') : '새 납품처';
      $('form-mode-badge').textContent = isEdit ? '편집' : '신규';
      $('form-meta').textContent = isEdit && r.updated_at
        ? `최종수정: ${new Date(r.updated_at).toLocaleString('ko-KR')}` : '';
      $('btn-delete').classList.toggle('hidden', !isEdit);
    }

    // 폼 → 저장용 객체. 시간은 displayToBizMin으로 동시 저장.
    function formToRow() {
      const deadlineText = $('f-deadline').value.trim();
      const deadlineBiz  = deadlineText ? displayToBizMin(normalizeTime(deadlineText)) : null;

      return {
        id:    $('f-id').value || undefined,
        code:  emptyToNull($('f-code').value.trim()),
        name:  $('f-name').value.trim(),
        address: emptyToNull($('f-address').value.trim()),
        region:  emptyToNull($('f-region').value.trim()),

        allow_under_1ton:    $('f-1ton').checked,
        allow_under_3_5ton:  $('f-3_5ton').checked,
        allow_over_5ton:     $('f-5ton').checked,
        allow_unmanned_yard: $('f-yard').checked,

        delivery_method:   getRadio('dmethod') || null,
        access_method:     getRadio('amethod') || null,
        delivery_location: getRadio('dloc')    || null,
        security_key_location: emptyToNull($('f-security-key-location').value.trim()),
        security_password:     emptyToNull($('f-security-password').value.trim()),

        deadline_text:         deadlineText ? normalizeTime(deadlineText) : null,
        deadline_business_min: deadlineBiz,

        rep_name:       emptyToNull($('f-rep-name').value.trim()),
        rep_phone:      emptyToNull($('f-rep-phone').value.trim()),
        contact_name:   emptyToNull($('f-mgr-name').value.trim()),
        contact_office: emptyToNull($('f-mgr-office').value.trim()),
        // 호환: 실제 운영 스키마에는 contact_mobile 컬럼이 없을 수 있으므로 contact 컬럼만 동기화
        contact:        emptyToNull($('f-mgr-mobile').value.trim()),
        memo:           emptyToNull($('f-memo').value.trim()),
        photos:         state.draftPhotos
      };
    }

    // -------------------------------------------------------------------------
    // 이벤트 바인딩
    // -------------------------------------------------------------------------
    function bindEvents() {
      $('search-input').addEventListener('input', debounce(() => {
        state.filters.search = $('search-input').value.trim();
        applyAndRender();
      }, 200));
      $('filter-region').addEventListener('change', () => {
        state.filters.region = $('filter-region').value;
        applyAndRender();
      });
      $('filter-method').addEventListener('change', () => {
        state.filters.method = $('filter-method').value;
        applyAndRender();
      });
      $('sort-key').addEventListener('change', () => {
        state.sort = $('sort-key').value;
        applyAndRender();
      });

      $('new-btn').addEventListener('click', () => {
        state.selectedId = null;
        renderList();
        resetForm();
      });

      $('btn-cancel').addEventListener('click', () => {
        if (state.selectedId) {
          // 편집 중이면 원본으로 되돌림
          const r = state.rows.find(x => x.id === state.selectedId);
          if (r) rowToForm(r);
        } else {
          resetForm();
        }
      });

      $('btn-extract-region').addEventListener('click', () => {
        const addr = $('f-address').value.trim();
        const region = extractRegionFromAddress(addr);
        if (region) {
          $('f-region').value = region;
          toast(`지역을 "${region}"으로 설정했습니다.`, 'success');
        } else {
          toast('주소에서 지역을 추출하지 못했습니다.', 'warn');
        }
      });

      // 시간 입력: blur 시 정규화 + 검증
      const dl = $('f-deadline');
      dl.addEventListener('blur', () => {
        const v = dl.value.trim();
        if (!v) return;
        const norm = normalizeTime(v);
        if (!norm) {
          toast('시간 형식이 올바르지 않습니다. 예: 22:00, 25:30', 'warn');
          return;
        }
        const biz = displayToBizMin(norm);
        if (biz == null) {
          toast('시간은 04:00 ~ 27:59 범위여야 합니다.', 'warn');
          return;
        }
        dl.value = norm;
      });

      $('f-photo-input').addEventListener('change', async (e) => {
        await addFormPhotos(Array.from(e.target.files || []));
        e.target.value = '';
      });
      $('f-photo-dropzone').addEventListener('paste', async (e) => {
        const files = imageFilesFromClipboard(e.clipboardData);
        if (!files.length) return;
        e.preventDefault();
        await addFormPhotos(files);
      });
      document.addEventListener('paste', async (e) => {
        const active = document.activeElement;
        const shouldHandle = active === $('f-photo-dropzone') || active === document.body;
        if (!shouldHandle) return;
        const files = imageFilesFromClipboard(e.clipboardData);
        if (!files.length) return;
        e.preventDefault();
        await addFormPhotos(files);
      });
      $('f-photo-dropzone').addEventListener('dragover', (e) => {
        e.preventDefault();
        $('f-photo-dropzone').classList.add('border-emerald-500', 'text-emerald-200');
      });
      $('f-photo-dropzone').addEventListener('dragleave', () => {
        $('f-photo-dropzone').classList.remove('border-emerald-500', 'text-emerald-200');
      });
      $('f-photo-dropzone').addEventListener('drop', async (e) => {
        e.preventDefault();
        $('f-photo-dropzone').classList.remove('border-emerald-500', 'text-emerald-200');
        await addFormPhotos(Array.from(e.dataTransfer?.files || []).filter(isProbablyImageFile));
      });

      // 저장
      $('dp-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        await saveForm();
      });

      // 삭제
      $('btn-delete').addEventListener('click', async () => {
        await deleteCurrent();
      });
    }

    // -------------------------------------------------------------------------
    // 행 선택 / 폼 초기화
    // -------------------------------------------------------------------------
    function selectRow(id) {
      state.selectedId = id;
      renderList();
      const r = state.rows.find(x => x.id === id);
      if (r) rowToForm(r);
    }

    function resetForm() {
      state.selectedId = null;
      rowToForm(null);
    }

    // -------------------------------------------------------------------------
    // 저장 (upsert)
    // -------------------------------------------------------------------------
    async function saveForm() {
      const row = formToRow();

      if (!row.name) {
        toast('이름은 필수입니다.', 'warn');
        $('f-name').focus();
        return;
      }

      // 시간 입력 재검증
      if ($('f-deadline').value.trim()) {
        const norm = normalizeTime($('f-deadline').value.trim());
        if (!norm || displayToBizMin(norm) == null) {
          toast('마감 시간 형식이 올바르지 않습니다.', 'warn');
          return;
        }
      }

      $('btn-save').disabled = true;
      try {
        // id 없으면 신규
        const payload = centerPayload({ ...row });
        if (!payload.id) delete payload.id;

        const { data, error, removedColumns } = await upsertDeliveryPointPayload(payload);

        if (error) {
          // 코드 unique 위반 등
          if (error.code === '23505') {
            toast('이미 사용 중인 코드입니다.', 'error');
          } else {
            toast(`저장 실패: ${error.message}`, 'error');
          }
          return;
        }

        if (removedColumns.length) {
          console.warn('[delivery-points] DB에 없는 컬럼은 제외하고 저장했습니다.', removedColumns);
        }
        toast(row.id ? '수정되었습니다.' : '추가되었습니다.', 'success');
        // 목록 갱신 + 방금 저장한 행 선택 유지
        const savedId = data.id;
        await loadList();
        selectRow(savedId);
      } catch (e) {
        console.error('[delivery-points] 저장 후 처리 중 오류', e);
      } finally {
        $('btn-save').disabled = false;
      }
    }


    async function upsertDeliveryPointPayload(initialPayload) {
      const payload = { ...initialPayload };
      const removedColumns = [];
      for (let attempt = 0; attempt < 12; attempt += 1) {
        const { data, error } = await supabase
          .from('delivery_points')
          .upsert(payload, { onConflict: 'id' })
          .select()
          .single();
        if (!error) return { data, error: null, removedColumns };
        const missingColumn = extractMissingSchemaColumn(error);
        if (!missingColumn || !(missingColumn in payload)) return { data: null, error, removedColumns };
        delete payload[missingColumn];
        removedColumns.push(missingColumn);
      }
      return { data: null, error: { message: '스키마 컬럼 재시도 횟수를 초과했습니다.' }, removedColumns };
    }

    function extractMissingSchemaColumn(error) {
      const message = error?.message || '';
      const match = message.match(/Could not find the '([^']+)' column/);
      return match?.[1] || '';
    }

    // -------------------------------------------------------------------------
    // 삭제 (사용 중인 route_stops 개수 확인 → 경고)
    // -------------------------------------------------------------------------
    async function deleteCurrent() {
      const id = $('f-id').value;
      if (!id) return;
      const r = state.rows.find(x => x.id === id);

      // 사용 중인 코스 항목 수
      let inUse = 0;
      try {
        const { count } = await supabase
          .from('route_stops')
          .select('id', { count: 'exact', head: true })
          .eq('delivery_point_id', id);
        inUse = count || 0;
      } catch {
        // 카운트 실패는 진행에 치명적이지 않으므로 무시
      }

      let msg = `"${r?.name || '이 납품처'}"를 삭제할까요?`;
      if (inUse > 0) {
        msg += `\n\n⚠ 이 납품처가 ${inUse}개 코스에 등록되어 있습니다.\n` +
               `코스에 등록된 상태이면 DB 제약상 삭제가 거부됩니다.\n` +
               `먼저 해당 코스에서 제거한 뒤 다시 시도하세요.`;
      }
      const ok = await confirmDialog(msg, { okText: '삭제', cancelText: '취소', danger: true });
      if (!ok) return;

      try {
        const { error } = await supabase
          .from('delivery_points')
          .delete()
          .eq('center_code', getRequiredCenter().code)
          .eq('id', id);
        if (error) {
          if (error.code === '23503') {
            toast('코스에 등록된 납품처라 삭제할 수 없습니다.', 'error');
          } else {
            toast(`삭제 실패: ${error.message}`, 'error');
          }
          return;
        }
        toast('삭제되었습니다.', 'success');
        await loadList();
        resetForm();
      } catch {
        toast('삭제 중 오류가 발생했습니다.', 'error');
      }
    }

    // -------------------------------------------------------------------------
    // 헬퍼
    // -------------------------------------------------------------------------


    const MAX_DELIVERY_POINT_PHOTOS = 6;
    const MAX_DELIVERY_POINT_PHOTO_BYTES = 1024 * 1024;
    const DELIVERY_POINT_PHOTO_MAX_WIDTH = 1280;
    const DELIVERY_POINT_PHOTO_MAX_HEIGHT = 720;

    function parseDeliveryPointPhotos(value) {
      if (!value) return [];
      if (Array.isArray(value)) return value.filter(p => p && p.dataUrl).slice(0, MAX_DELIVERY_POINT_PHOTOS);
      if (typeof value === 'string') {
        try {
          const parsed = JSON.parse(value);
          return Array.isArray(parsed) ? parsed.filter(p => p && p.dataUrl).slice(0, MAX_DELIVERY_POINT_PHOTOS) : [];
        } catch {
          return [];
        }
      }
      return [];
    }

    async function addFormPhotos(files) {
      if (!files.length) return;
      const remaining = MAX_DELIVERY_POINT_PHOTOS - state.draftPhotos.length;
      if (remaining <= 0) {
        toast('사진은 납품처당 최대 6장까지 등록할 수 있습니다.', 'warn');
        return;
      }
      const imageFiles = files.filter(isProbablyImageFile);
      if (!imageFiles.length) {
        renderPhotoMessage('이미지 파일을 찾지 못했습니다. JPG/PNG/WebP 파일을 선택하거나 복사해주세요.', 'warn');
        return;
      }
      const selected = imageFiles.slice(0, remaining);
      if (files.length > remaining) toast(`최대 6장까지만 등록되어 ${remaining}장만 추가합니다.`, 'warn');
      renderPhotoMessage('사진을 불러와 압축하는 중입니다...', 'info');
      try {
        for (const file of selected) {
          const photo = await compressDeliveryPointPhoto(file);
          state.draftPhotos.push(photo);
          renderFormPhotos();
        }
        renderFormPhotos();
        toast('사진이 추가되었습니다. 저장 버튼을 눌러 반영하세요.', 'success');
      } catch (err) {
        renderPhotoMessage(err?.message || '사진 처리 중 오류가 발생했습니다.', 'error');
        console.error('[delivery-points] 사진 처리 실패', err);
      }
    }

    function isProbablyImageFile(file) {
      if (!file) return false;
      if (file.type?.startsWith('image/')) return true;
      return /\.(jpe?g|png|webp|gif)$/i.test(file.name || '');
    }

    function renderPhotoMessage(message, type = 'info') {
      const grid = $('f-photo-grid');
      if (!grid) return;
      const color = type === 'error' ? 'text-red-300' : type === 'warn' ? 'text-amber-300' : 'text-emerald-300';
      grid.innerHTML = `<div class="col-span-3 rounded border border-zinc-700 bg-zinc-900/40 px-3 py-4 text-center text-xs ${color}">${escapeHtml(message)}</div>`;
    }

    function renderFormPhotos() {
      const grid = $('f-photo-grid');
      const count = $('f-photo-count');
      if (!grid || !count) return;
      count.textContent = `${state.draftPhotos.length}/${MAX_DELIVERY_POINT_PHOTOS}`;
      if (!state.draftPhotos.length) {
        grid.innerHTML = '<div class="col-span-3 rounded border border-zinc-700 bg-zinc-900/40 px-3 py-4 text-center text-xs text-zinc-500">등록된 사진이 없습니다.</div>';
        return;
      }
      grid.innerHTML = state.draftPhotos.map((photo, idx) => `
        <div class="relative overflow-hidden rounded border border-zinc-700 bg-zinc-900">
          <button type="button" data-photo-view="${idx}" class="block h-24 w-full">
            <img src="${escapeAttr(photo.dataUrl)}" alt="납품처 사진 ${idx + 1}" class="h-full w-full object-cover">
          </button>
          <button type="button" data-photo-delete="${idx}" class="absolute right-1 top-1 rounded bg-red-600/90 px-1.5 py-0.5 text-[10px] text-white">삭제</button>
        </div>`).join('');
      grid.querySelectorAll('[data-photo-view]').forEach(btn => {
        btn.addEventListener('click', () => openPhotoPreview(state.draftPhotos[Number(btn.dataset.photoView)]));
      });
      grid.querySelectorAll('[data-photo-delete]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.draftPhotos.splice(Number(btn.dataset.photoDelete), 1);
          renderFormPhotos();
        });
      });
    }

    async function compressDeliveryPointPhoto(file) {
      if (!isProbablyImageFile(file)) throw new Error('이미지 파일만 업로드할 수 있습니다.');
      let bitmap;
      try {
        bitmap = await fileToImage(file);
      } catch (err) {
        if (file.size <= MAX_DELIVERY_POINT_PHOTO_BYTES) {
          return {
            id: crypto.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`,
            name: file.name || 'delivery-point-photo',
            type: file.type || 'image/jpeg',
            size: file.size,
            dataUrl: await fileToDataUrl(file),
            createdAt: new Date().toISOString()
          };
        }
        throw err;
      }
      const ratio = Math.min(1, DELIVERY_POINT_PHOTO_MAX_WIDTH / bitmap.naturalWidth, DELIVERY_POINT_PHOTO_MAX_HEIGHT / bitmap.naturalHeight);
      const width = Math.max(1, Math.round(bitmap.naturalWidth * ratio));
      const height = Math.max(1, Math.round(bitmap.naturalHeight * ratio));
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(bitmap, 0, 0, width, height);
      let blob = null;
      for (const quality of [0.86, 0.78, 0.7, 0.62, 0.54, 0.46]) {
        blob = await canvasToBlob(canvas, 'image/jpeg', quality);
        if (blob.size <= MAX_DELIVERY_POINT_PHOTO_BYTES) break;
      }
      if (!blob || blob.size > MAX_DELIVERY_POINT_PHOTO_BYTES) throw new Error('사진을 1MB 이하로 압축하지 못했습니다. 더 작은 이미지를 사용해주세요.');
      return {
        id: crypto.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        name: file.name || 'delivery-point-photo.jpg',
        type: 'image/jpeg',
        size: blob.size,
        dataUrl: await blobToDataUrl(blob),
        createdAt: new Date().toISOString()
      };
    }

    function fileToImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('이미지를 읽지 못했습니다.')); };
        img.src = url;
      });
    }
    function canvasToBlob(canvas, type, quality) {
      return new Promise((resolve, reject) => {
        canvas.toBlob(blob => {
          if (blob) resolve(blob);
          else reject(new Error('브라우저가 이미지를 압축하지 못했습니다.'));
        }, type, quality);
      });
    }
    function blobToDataUrl(blob) {
      return fileToDataUrl(blob);
    }
    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('이미지를 읽지 못했습니다.'));
        reader.readAsDataURL(file);
      });
    }
    function openPhotoPreview(photo) {
      if (!photo?.dataUrl) return;
      const win = window.open('', '_blank', 'noopener,noreferrer');
      if (win) win.document.write(`<img src="${photo.dataUrl}" style="max-width:100%;height:auto;display:block;margin:0 auto;">`);
    }

    function imageFilesFromClipboard(clipboardData) {
      const items = Array.from(clipboardData?.items || []);
      return items
        .filter(item => item.kind === 'file' && item.type?.startsWith('image/'))
        .map(item => item.getAsFile())
        .filter(Boolean);
    }

    // 시간 입력 정규화: "9:5" → "09:05", 한 자리들 보정
    function normalizeTime(str) {
      if (!str) return '';
      const s = String(str).trim();
      const m = s.match(/^(\d{1,2})\s*[:.시]\s*(\d{1,2})(?:\s*분)?(?:\s*(AM|PM|오전|오후))?$/i);
      if (!m) return '';
      let h = parseInt(m[1], 10);
      const mn = parseInt(m[2], 10);
      const meridiem = (m[3] || '').toUpperCase();
      if (Number.isNaN(h) || Number.isNaN(mn)) return '';
      if (mn < 0 || mn > 59) return '';
      if (meridiem === 'PM' || meridiem === '오후') {
        if (h >= 1 && h <= 11) h += 12;
      } else if (meridiem === 'AM' || meridiem === '오전') {
        if (h === 12) h = 0;
      }
      if (h < 0 || h > 23) return '';
      return `${String(h).padStart(2, '0')}:${String(mn).padStart(2, '0')}`;
    }

    // 주소에서 시/구 또는 시/군 추출 (간단한 휴리스틱)
    function extractRegionFromAddress(addr) {
      if (!addr) return '';
      const s = addr.trim();

      // 광역시/도 + (시|군|구) 형태를 우선 추출
      // 예: "서울특별시 강남구 ..." → "서울 강남구"
      //     "경기도 성남시 분당구 ..." → "성남시 분당구"
      const tokens = s.split(/\s+/);
      const out = [];
      for (const t of tokens) {
        if (out.length === 0 && /(특별시|광역시|특별자치시|특별자치도|도)$/.test(t)) {
          out.push(t.replace(/(특별시|광역시|특별자치시|특별자치도|도)$/, ''));
          continue;
        }
        if (/(시|군|구)$/.test(t)) {
          out.push(t);
          // 성남시 분당구 같은 2단계까지
          if (out.length >= 3) break;
        } else if (out.length > 0) {
          // 광역 다음 처음 만난 비-시/군/구 토큰은 멈춤
          break;
        }
      }
      return out.join(' ').trim();
    }

    function setRadio(name, val) {
      const list = document.querySelectorAll(`input[name="${name}"]`);
      list.forEach(el => { el.checked = (el.value === (val || '')); });
    }
    function getRadio(name) {
      const el = document.querySelector(`input[name="${name}"]:checked`);
      return el ? el.value : '';
    }
    function emptyToNull(v) { return v === '' || v == null ? null : v; }
    function escapeHtml(s) {
      return String(s ?? '')
        .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
        .replaceAll('"','&quot;').replaceAll("'",'&#39;');
    }
    function escapeAttr(s) { return escapeHtml(s); }
    function debounce(fn, wait) {
      let t = null;
      return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), wait); };
    }
  </script>
