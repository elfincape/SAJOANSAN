<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>문서 작성 도구 · 관리 허브</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/document-editor.css">
</head>
<body>
  <header class="document-header">
    <a id="back-link" href="/admin/" class="btn btn-ghost">← 관리 허브</a>
    <h1>문서 작성 도구</h1><span id="user-badge" class="muted"></span>
  </header>
  <main class="document-main">
    <p class="muted">내 계정의 초안 한 개를 현재 브라우저에 자동 저장합니다. 기기 간 동기화·공유는 지원하지 않습니다. 중요한 문서는 파일로 내려받으세요.</p>
    <p id="status" role="status" aria-live="polite">문서 도구를 준비하고 있습니다.</p>
    <fieldset id="workspace" disabled>
      <div class="document-actions">
        <label for="document-title">문서 제목</label>
        <input id="document-title" class="app-input" placeholder="제목 없는 문서" maxlength="160">
        <button id="save-document" class="btn btn-ghost" type="button">초안 저장</button>
        <button id="export-html" class="btn btn-primary" type="button">HTML 다운로드</button>
        <button id="export-text" class="btn btn-ghost" type="button">TXT 다운로드</button>
        <button id="new-document" class="btn btn-danger" type="button">새 문서</button>
      </div>
      <div id="editor-toolbar" class="document-toolbar" role="toolbar" aria-label="문서 서식">
        <label for="block-style" class="sr-only">문단 스타일</label>
        <select id="block-style" class="app-select"><option value="0">본문</option><option value="1">제목 1</option><option value="2">제목 2</option><option value="3">제목 3</option></select>
        <button data-command="bold" type="button" aria-pressed="false"><strong>굵게</strong></button>
        <button data-command="italic" type="button" aria-pressed="false"><em>기울임</em></button>
        <button data-command="underline" type="button" aria-pressed="false"><u>밑줄</u></button>
        <button data-command="strike" type="button" aria-pressed="false">취소선</button>
        <button data-command="bulletList" type="button" aria-pressed="false">• 글머리 목록</button>
        <button data-command="orderedList" type="button" aria-pressed="false">1. 번호 목록</button>
        <button data-command="blockquote" type="button" aria-pressed="false">인용</button>
        <button data-command="link" type="button" aria-pressed="false">링크</button>
        <button data-command="unlink" type="button">링크 해제</button>
        <button data-command="undo" type="button">실행 취소</button>
        <button data-command="redo" type="button">다시 실행</button>
      </div>
      <div class="document-paper"><div id="document-content" aria-label="문서 본문"></div></div>
      <div class="document-footer"><span id="counts" class="muted"></span><span class="muted">Ctrl+B 굵게 · Ctrl+I 기울임 · Ctrl+Z 실행 취소</span></div>
    </fieldset>
  </main>
  <script type="module" src="/js/document-editor.js"></script>
</body>
</html>
