<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>운영 업무 · 관리허브</title>
  <link rel="stylesheet" href="/css/operations.css">
  <script defer src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
</head>
<body>
  <header><a href="/admin/">← 관리허브</a><strong>운영 업무</strong><span id="user"></span></header>
  <main>
    <div class="heading"><div><h1>업무와 특이사항</h1><p>센터별 진행 상황과 실제 처리 기록을 확인하세요.</p></div><div><button id="sync" hidden>업무 노션 동기화</button> <button id="refresh">새로고침</button></div></div>
    <nav aria-label="조회 화면"><button data-view="tasks" aria-pressed="true">업무 현황</button><button data-view="daily" aria-pressed="false">일일·주간 기록</button><button data-view="incidents" aria-pressed="false">특이사항</button></nav>
    <form id="filters" class="filters">
      <label>센터<select name="center"><option value="001">안산</option><option value="002">평택</option></select></label>
      <label>기간<select name="period"><option value="day">일간</option><option value="week">최근 7일</option><option value="month">월간</option><option value="custom">직접 선택</option></select></label>
      <label>시작일<input name="from" type="date" required></label><label>종료일<input name="through" type="date" required></label>
      <label>업무<select name="kind"><option value="">전체</option><option value="replacement">대차 배차 진행</option></select></label>
      <label>정산방식<select name="settlement"><option value="">전체</option><option>월대공제</option><option>기사직접</option></select></label>
      <label class="check"><input name="unfinished" type="checkbox" checked>미완료만</label>
      <button type="submit" class="primary">조회</button><button id="export" type="button">엑셀 다운로드</button>
    </form>
    <div id="message" role="status" aria-live="polite"></div>
    <div class="workspace"><section class="list" aria-label="업무 목록"><div class="list-heading"><strong id="list-title">업무 현황</strong><span id="count"></span></div><div class="table-scroll"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div></section>
    <aside id="detail" aria-label="선택한 항목"><div class="placeholder"><h2>항목을 선택하세요</h2><p>왼쪽 목록에서 업무나 특이사항을 누르면 상세 내용을 볼 수 있습니다.</p></div></aside></div>
  </main><script type="module" src="/js/operations-screen.js"></script>
</body></html>
