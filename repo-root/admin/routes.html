<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>코스 관리 · 코스표 관리 시스템</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    #route-grid { height:calc(100vh - 200px); min-height:420px; }
    .route-toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:12px; }
    .route-toolbar #search-input { flex:1 1 320px; min-width:200px; }
    .route-toolbar #filter-company { width:172px; }
    .route-toolbar .btn { min-height:38px; white-space:nowrap; }
    .route-toolbar [aria-pressed="true"] { background:#e7f3ee; border-color:#087f72; color:#08634f; }
    .route-filter-summary { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; padding:0 2px 10px; color:#526776; font-size:12px; }
    #route-grid .ag-sort-order { display:none; }
    #route-grid .ag-header-cell, #route-grid .ag-cell { padding-inline:12px; }
    #route-grid .route-grid-action-cell { padding-inline:8px; }
    .route-grid-actions { display:flex; justify-content:flex-start; gap:6px; height:100%; align-items:center; }
    #route-grid .route-grid-actions .btn { min-height:36px; padding:0 10px; font-size:12px; line-height:1; }
    #route-grid .route-action-stops { background:#e8f3ee; color:#08634f; border-color:#c1dace; font-weight:600; }
    #route-grid .route-action-delete { border-color:transparent; background:transparent; color:#b42332; }
    #route-grid .route-action-delete:hover { background:#fff0f0; border-color:#efc2c7; }
    .route-grid-days { display:flex; flex-wrap:wrap; align-items:center; gap:.25rem; height:100%; }
    .route-grid-day { font-size:.6875rem; line-height:1.4; padding:.125rem .25rem; border-radius:.25rem; background:#fff1f2; border:1px solid #f2c9cf; color:#a51e36; }
    @media (max-width:640px) {
      .route-toolbar #search-input { flex-basis:100%; min-width:0; }
      .route-toolbar #filter-company { flex:1; min-width:120px; }
      .route-toolbar .btn, #route-grid .route-grid-actions .btn { min-height:42px; }
      #route-grid { height:calc(100vh - 285px); }
    }
  </style>
<link rel="stylesheet" href="/css/workspace-ui.css">
</head>
<body class="workspace-ui bg-zinc-900 text-zinc-100 min-h-screen flex flex-col">

  <!-- 헤더 -->
  <header class="border-b border-zinc-800 sticky top-0 z-30 bg-zinc-900/95 backdrop-blur">
    <div class="max-w-[1400px] mx-auto px-4 py-3 flex items-center gap-3">
      <a href="/admin/" class="text-xs text-zinc-400 hover:text-zinc-100">← 관리 허브</a>
      <h1 class="text-base font-semibold">코스 관리</h1>
      <div class="flex-1"></div>
      <span id="user-badge" class="text-xs text-zinc-400 hidden sm:inline"></span>
      <a href="/" class="btn btn-ghost">대시보드</a>
    </div>
  </header>

  <main class="flex-1 max-w-[1400px] w-full mx-auto px-4 py-3">
    <!-- 툴바 -->
    <div class="route-toolbar" role="search" aria-label="코스 검색 및 필터">
      <input id="search-input" type="search" aria-label="코스명, 호차, 기사, 차량번호 검색" placeholder="코스명/호차/기사/차량번호 검색"
             class="app-input flex-1 min-w-[220px]">
      <select id="filter-company" aria-label="운수사 선택" class="app-select w-44">
        <option value="">운수사(전체)</option>
      </select>
      <button id="column-filters-btn" type="button" class="btn btn-ghost" aria-pressed="false" aria-controls="route-grid">상세 필터</button>
      <button id="reset-filters-btn" type="button" class="btn btn-ghost hidden">필터 초기화</button>
      <button id="new-btn" class="btn btn-primary">+ 새 코스</button>
    </div>

    <div class="route-filter-summary">
      <span id="filter-summary" role="status" aria-live="polite">전체 코스</span>
      <span>열 제목을 눌러 정렬 · Shift로 추가 정렬</span>
    </div>
    <div id="route-grid" aria-label="코스 목록"></div>

    <div class="px-1 py-2 text-xs text-zinc-400 flex items-center justify-between">
      <span id="result-count"></span>
      <span id="loading-indicator" class="hidden">불러오는 중...</span>
    </div>
  </main>

  <script type="module">
    import { AllCommunityModule, ModuleRegistry, createGrid, themeQuartz } from 'ag-grid-community';
    import { mountNotionGraph } from '/js/notion-graph-ui.js';
    import { supabase } from '/js/supabase.js';
    import { requireRole } from '/js/auth.js';
    import { toast, openModal, closeModal, confirmDialog } from '/js/ui.js';
    import {
      centerPayload,
      decorateCenterLinks,
      forceCenterSelectionFromUrl,
      getRequiredCenter,
      mountHeaderCenterSwitcher,
      requireSelectedCenter,
      scopeByCenter,
      withCenterParam
    } from '/js/center.js';

    ModuleRegistry.registerModules([AllCommunityModule]);

    // -------------------------------------------------------------------------
    // 권한
    // -------------------------------------------------------------------------
    const profile = await requireRole('editor');
    if (!profile) { /* 리다이렉트 */ }
    document.getElementById('user-badge').textContent =
      `${profile.display_name || profile.email || ''} (${profile.role})`;
    await requireSelectedCenter({ force: forceCenterSelectionFromUrl() });
    mountHeaderCenterSwitcher(next => location.replace(withCenterParam(location.pathname + location.search, next)));
    decorateCenterLinks(document);

    // -------------------------------------------------------------------------
    // 상태
    // -------------------------------------------------------------------------
    const state = {
      routes: [],            // 코스 본체
      stopCounts: new Map(), // route_id -> 납품처 개수
      companies: [],
      drivers: [],
      vehicles: [],
      filtered: [],
      filters: { search: '', companyId: '' }
    };

    const $ = (id) => document.getElementById(id);
    const collator = new Intl.Collator('ko-KR', { numeric: true, sensitivity: 'base' });
    const compactGrid = window.matchMedia('(max-width: 760px)');
    const gridApi = createGrid($('route-grid'), {
      theme: themeQuartz.withParams({
        accentColor: '#087f72',
        backgroundColor: '#ffffff',
        borderColor: '#d8e2e8',
        foregroundColor: '#203443',
        headerBackgroundColor: '#edf2f5',
        rowHoverColor: '#edf6f2'
      }),
      columnDefs: [
        { field: 'company', headerName: '운수사', width: 160, minWidth: 140, sort: 'asc', sortIndex: 0 },
        { field: 'carNumber', headerName: '호차', width: 125, minWidth: 100, sort: 'asc', sortIndex: 1 },
        { field: 'routeName', headerName: '코스명', width: 170, minWidth: 145, sort: 'asc', sortIndex: 2 },
        { field: 'primaryDriver', headerName: '주기사', width: 110, minWidth: 100 },
        { field: 'secondaryDriver', headerName: '보조기사', width: 110, minWidth: 100, cellStyle: { color: '#526776' } },
        { field: 'primaryVehicle', headerName: '주차량', width: 160, minWidth: 155 },
        { field: 'stopCount', headerName: '납품처', width: 95, filter: 'agNumberColumnFilter', cellStyle: { textAlign: 'right' } },
        { field: 'closedDaysText', headerName: '휴무일', minWidth: 135, cellRenderer: closedDaysRenderer },
        { field: 'activeLabel', headerName: '상태', width: 95, cellRenderer: statusRenderer },
        { headerName: '작업', colId: 'actions', width: 216, minWidth: 216, pinned: compactGrid.matches ? null : 'right', cellClass: 'route-grid-action-cell', sortable: false, filter: false, resizable: false, cellRenderer: actionRenderer }
      ],
      defaultColDef: {
        sortable: true,
        filter: 'agTextColumnFilter',
        floatingFilter: false,
        suppressHeaderFilterButton: true,
        resizable: true,
        comparator: (left, right) => collator.compare(String(left ?? ''), String(right ?? ''))
      },
      rowData: [],
      getRowId: params => params.data.id,
      rowHeight: compactGrid.matches ? 52 : 46,
      headerHeight: 44,
      onFilterChanged: event => updateFilterSummary(event.api),
      onModelUpdated: event => updateFilterSummary(event.api),
      floatingFiltersHeight: 38,
      animateRows: false,
      suppressCellFocus: true,
      overlayNoRowsTemplate: '<span class="text-sm text-zinc-500">조건에 맞는 코스가 없습니다.</span>'
    });

    // -------------------------------------------------------------------------
    // 부트
    // -------------------------------------------------------------------------
    bindEvents();
    await Promise.all([loadMasters(), loadRoutes()]);
    applyAndRender();
    const notionGraph=mountNotionGraph({profile,kind:'routes',onRefresh:async()=>{await Promise.all([loadMasters(),loadRoutes()]);applyAndRender();}});

    // -------------------------------------------------------------------------
    // 데이터 로드
    // -------------------------------------------------------------------------
    async function loadMasters() {
      try {
        const [c, d, v] = await Promise.all([
          scopeByCenter(supabase.from('companies').select('id, name').order('name')),
          scopeByCenter(supabase.from('drivers').select('id, name, phone, company_id').order('name')),
          scopeByCenter(supabase.from('vehicles').select('id, plate_number, tonnage, company_id').order('plate_number'))
        ]);
        if (c.error || d.error || v.error) throw (c.error || d.error || v.error);
        state.companies = c.data || [];
        state.drivers   = d.data || [];
        state.vehicles  = v.data || [];

        // 필터 셀렉트
        $('filter-company').innerHTML =
          '<option value="">운수사(전체)</option>' +
          state.companies.map(co => `<option value="${co.id}">${escapeHtml(co.name)}</option>`).join('');
      } catch (e) {
        toast('마스터 데이터를 불러오지 못했습니다.', 'error');
      }
    }

    async function loadRoutes() {
      $('loading-indicator').classList.remove('hidden');
      try {
        const { data, error } = await scopeByCenter(
          supabase.from('routes').select('*')
        );
        if (error) throw error;
        state.routes = data || [];

        // 납품처 개수 (route_id 별)
        const routeIds = state.routes.map(r => r.id);
        const { data: counts, error: cErr } = routeIds.length
          ? await supabase.from('route_stops').select('route_id').in('route_id', routeIds)
          : { data: [], error: null };
        if (cErr) throw cErr;
        const map = new Map();
        for (const row of counts || []) {
          map.set(row.route_id, (map.get(row.route_id) || 0) + 1);
        }
        state.stopCounts = map;
      } catch (e) {
        toast('코스 목록을 불러오지 못했습니다.', 'error');
        state.routes = [];
        state.stopCounts = new Map();
      } finally {
        $('loading-indicator').classList.add('hidden');
      }
    }

    // -------------------------------------------------------------------------
    // 필터/렌더
    // -------------------------------------------------------------------------
    function applyAndRender() {
      const f = state.filters;
      const q = f.search.toLowerCase();

      const drvById = new Map(state.drivers.map(d => [d.id, d]));
      const vehById = new Map(state.vehicles.map(v => [v.id, v]));
      const coById  = new Map(state.companies.map(c => [c.id, c]));

      state.filtered = state.routes.filter(r => {
        if (f.companyId && r.company_id !== f.companyId) return false;
        if (q) {
          const pdrv = drvById.get(r.primary_driver_id);
          const sdrv = drvById.get(r.secondary_driver_id);
          const pveh = vehById.get(r.primary_vehicle_id);
          const sveh = vehById.get(r.secondary_vehicle_id);
          const hay = [
            r.name, r.car_number,
            pdrv?.name, sdrv?.name,
            pveh?.plate_number, sveh?.plate_number
          ].filter(Boolean).join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      renderGrid({ coById, drvById, vehById });
      updateFilterSummary(gridApi);
    }

    function updateFilterSummary(api) {
      const count = Object.keys(api.getFilterModel()).length + Number(Boolean(state.filters.search)) + Number(Boolean(state.filters.companyId));
      $('filter-summary').textContent = count ? `필터 ${count}개 적용 중` : '전체 코스';
      $('reset-filters-btn').classList.toggle('hidden', !count);
      const shown = api.getDisplayedRowCount();
      $('result-count').textContent = state.routes.length === 0 ? '코스 없음' : shown === state.routes.length ? `총 ${shown}건` : `${shown}건 표시 · 전체 ${state.routes.length}건`;
    }

    function renderGrid({ coById, drvById, vehById }) {
      const rows = state.filtered.map(route => ({
        id: route.id,
        route,
        company: coById.get(route.company_id)?.name || '',
        carNumber: route.car_number || '',
        routeName: route.name || '',
        primaryDriver: drvById.get(route.primary_driver_id)?.name || '',
        secondaryDriver: drvById.get(route.secondary_driver_id)?.name || '',
        primaryVehicle: vehById.get(route.primary_vehicle_id)?.plate_number || '',
        stopCount: state.stopCounts.get(route.id) || 0,
        closedDays: (route.closed_days || []).slice().sort((left, right) => left - right),
        closedDaysText: (route.closed_days || []).slice().sort((left, right) => left - right).join(','),
        activeLabel: route.active === false ? '비활성' : '활성'
      }));
      gridApi.setGridOption('rowData', rows);
      if (rows.length) gridApi.hideOverlay();
      else gridApi.showNoRowsOverlay();
    }

    // -------------------------------------------------------------------------
    // 이벤트
    // -------------------------------------------------------------------------
    function bindEvents() {
      $('search-input').addEventListener('input', debounce(() => {
        state.filters.search = $('search-input').value.trim();
        applyAndRender();
      }, 200));
      $('filter-company').addEventListener('change', () => {
        state.filters.companyId = $('filter-company').value;
        applyAndRender();
      });
      $('column-filters-btn').addEventListener('click', () => {
        const button = $('column-filters-btn');
        const expanded = button.getAttribute('aria-pressed') !== 'true';
        button.setAttribute('aria-pressed', String(expanded));
        gridApi.setGridOption('defaultColDef', { ...gridApi.getGridOption('defaultColDef'), floatingFilter: expanded, suppressHeaderFilterButton: !expanded });
      });
      $('reset-filters-btn').addEventListener('click', () => {
        $('search-input').value = '';
        $('filter-company').value = '';
        state.filters = { search: '', companyId: '' };
        gridApi.setFilterModel(null);
        applyAndRender();
      });
      compactGrid.addEventListener('change', event => {
        gridApi.setColumnsPinned(['actions'], event.matches ? null : 'right');
        gridApi.setGridOption('rowHeight', event.matches ? 52 : 46);
        gridApi.resetRowHeights();
      });
      $('new-btn').addEventListener('click', () => openRouteForm(null));
    }

    // -------------------------------------------------------------------------
    // 코스 신규/편집 모달
    // -------------------------------------------------------------------------
    function openRouteForm(route) {
      const isEdit = !!route;
      const wrap = document.createElement('div');
      wrap.className = 'p-5';

      wrap.innerHTML = `
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-base font-semibold">${isEdit ? '코스 편집' : '새 코스'}</h2>
          <button data-x class="btn btn-ghost text-xs">닫기</button>
        </div>
        <form id="route-form" class="space-y-3" novalidate>
          <div>
            <label class="app-label">코스명 *</label>
            <input id="r-name" class="app-input" required>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="app-label">호차</label>
              <input id="r-car" class="app-input" placeholder="예: 대-14호차">
            </div>
            <div>
              <label class="app-label">운수사</label>
              <select id="r-company" class="app-select">
                <option value="">선택 안 함</option>
                ${state.companies.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="app-label">주기사</label>
              <select id="r-driver" class="app-select"></select>
            </div>
            <div>
              <label class="app-label">주차량</label>
              <select id="r-vehicle" class="app-select"></select>
            </div>
            <div>
              <label class="app-label">보조기사</label>
              <select id="r-driver2" class="app-select"></select>
            </div>
            <div>
              <label class="app-label">보조차량</label>
              <select id="r-vehicle2" class="app-select"></select>
            </div>
          </div>
          <label class="cb"><input type="checkbox" id="r-active" checked> 활성</label>
          <div>
            <label class="app-label">휴무일</label>
            <div class="flex gap-3 flex-wrap mt-1">
              <label class="cb text-xs"><input type="checkbox" class="cd-check" value="0"> 일</label>
              <label class="cb text-xs"><input type="checkbox" class="cd-check" value="1"> 월</label>
              <label class="cb text-xs"><input type="checkbox" class="cd-check" value="2"> 화</label>
              <label class="cb text-xs"><input type="checkbox" class="cd-check" value="3"> 수</label>
              <label class="cb text-xs"><input type="checkbox" class="cd-check" value="4"> 목</label>
              <label class="cb text-xs"><input type="checkbox" class="cd-check" value="5"> 금</label>
              <label class="cb text-xs"><input type="checkbox" class="cd-check" value="6"> 토</label>
            </div>
            <p class="text-[10px] text-zinc-500 mt-1">체크한 요일에는 이 코스가 운행하지 않습니다.</p>
          </div>
          <div class="flex items-center gap-2 pt-2 border-t border-zinc-700">
            <button type="submit" class="btn btn-primary">저장</button>
            <button type="button" data-x class="btn btn-ghost">취소</button>
          </div>
        </form>
      `;

      openModal(wrap, { width: 'lg' });

      // 닫기
      wrap.querySelectorAll('[data-x]').forEach(b => b.addEventListener('click', closeModal));

      // 초기값
      if (isEdit) {
        wrap.querySelector('#r-name').value    = route.name || '';
        wrap.querySelector('#r-car').value     = route.car_number || '';
        wrap.querySelector('#r-company').value = route.company_id || '';
        wrap.querySelector('#r-active').checked = route.active !== false;
        const cd = route.closed_days || [];
        wrap.querySelectorAll('.cd-check').forEach(cb => {
          cb.checked = cd.includes(Number(cb.value));
        });
      }

      // 운수사 변경 → 기사/차량 셀렉트 필터
      const drvSel  = wrap.querySelector('#r-driver');
      const drvSel2 = wrap.querySelector('#r-driver2');
      const vehSel  = wrap.querySelector('#r-vehicle');
      const vehSel2 = wrap.querySelector('#r-vehicle2');

      function refreshDropdowns(companyId, keep) {
        const drvs = state.drivers.filter(d => !companyId || d.company_id === companyId);
        const vehs = state.vehicles.filter(v => !companyId || v.company_id === companyId);
        drvSel.innerHTML  = optionListDriver(drvs);
        drvSel2.innerHTML = '<option value="">없음</option>' + optionListDriver(drvs);
        vehSel.innerHTML  = optionListVehicle(vehs);
        vehSel2.innerHTML = '<option value="">없음</option>' + optionListVehicle(vehs);

        if (keep) {
          if (route?.primary_driver_id    && drvs.find(x => x.id === route.primary_driver_id))    drvSel.value  = route.primary_driver_id;
          if (route?.secondary_driver_id  && drvs.find(x => x.id === route.secondary_driver_id))  drvSel2.value = route.secondary_driver_id;
          if (route?.primary_vehicle_id   && vehs.find(x => x.id === route.primary_vehicle_id))   vehSel.value  = route.primary_vehicle_id;
          if (route?.secondary_vehicle_id && vehs.find(x => x.id === route.secondary_vehicle_id)) vehSel2.value = route.secondary_vehicle_id;
        }
      }
      refreshDropdowns(route?.company_id || '', true);

      wrap.querySelector('#r-company').addEventListener('change', (e) => {
        refreshDropdowns(e.target.value, false);
      });

      // 저장
      wrap.querySelector('#route-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = wrap.querySelector('#r-name').value.trim();
        if (!name) {
          toast('코스명은 필수입니다.', 'warn');
          return;
        }
        const closedDays = [...wrap.querySelectorAll('.cd-check:checked')]
          .map(cb => Number(cb.value))
          .sort((a, b) => a - b);
        const payload = centerPayload({
          name,
          car_number: nullIfEmpty(wrap.querySelector('#r-car').value.trim()),
          company_id: nullIfEmpty(wrap.querySelector('#r-company').value),
          primary_driver_id:    nullIfEmpty(drvSel.value),
          primary_vehicle_id:   nullIfEmpty(vehSel.value),
          secondary_driver_id:  nullIfEmpty(drvSel2.value),
          secondary_vehicle_id: nullIfEmpty(vehSel2.value),
          active:      wrap.querySelector('#r-active').checked,
          closed_days: closedDays
        });
        if (isEdit) payload.id = route.id;

        try {
          const { data: savedRoute, error } = await supabase
            .from('routes')
            .upsert(payload, { onConflict: 'id' }).select('id').single();
          if (error) {
            toast(`저장 실패: ${error.message}`, 'error');
            return;
          }
          toast(isEdit ? '수정되었습니다.' : '추가되었습니다.', 'success');
          closeModal();
          await loadRoutes();
          applyAndRender();
          void notionGraph.syncOne(savedRoute.id);
        } catch {
          toast('저장 중 오류가 발생했습니다.', 'error');
        }
      });

      function optionListDriver(arr) {
        return arr.map(d => `<option value="${d.id}">${escapeHtml(d.name)}${d.phone ? ' · ' + escapeHtml(d.phone) : ''}</option>`).join('');
      }
      function optionListVehicle(arr) {
        return arr.map(v => `<option value="${v.id}">${escapeHtml(v.plate_number)}${v.tonnage ? ' · ' + v.tonnage + 't' : ''}</option>`).join('');
      }
    }


    // -------------------------------------------------------------------------
    // 납품처 편집 팝업
    // -------------------------------------------------------------------------
    function openRouteStopsPopup(routeId) {
      const route = state.routes.find(x => x.id === routeId);
      if (!route) return;
      const src = withCenterParam(`/admin/route-edit.html?id=${encodeURIComponent(routeId)}`, getRequiredCenter());
      const stops = state.stopCounts.get(routeId) || 0;
      const wrap = document.createElement('div');
      wrap.className = 'p-4';
      wrap.innerHTML = `
        <div class="flex items-center justify-between gap-3 mb-3">
          <div>
            <h2 class="text-base font-semibold">납품처 편집</h2>
            <p class="text-xs text-zinc-400 mt-1">${escapeHtml(route.name || '')} · ${escapeHtml(route.car_number || '')} · 납품처 ${stops}개</p>
          </div>
          <button data-x class="btn btn-ghost text-xs">닫기</button>
        </div>
        <iframe
          src="${escapeAttr(src)}"
          title="${escapeAttr(route.name || '코스')} 납품처 편집"
          class="w-full h-[78vh] rounded-lg border border-zinc-700 bg-zinc-950"
        ></iframe>
      `;
      openModal(wrap, { width: '5xl', dismissable: false });
      wrap.querySelector('[data-x]').addEventListener('click', async () => {
        closeModal();
        await loadRoutes();
        applyAndRender();
      });
    }

    // -------------------------------------------------------------------------
    // 코스 삭제
    // -------------------------------------------------------------------------
    async function deleteRoute(id) {
      const r = state.routes.find(x => x.id === id);
      if (!r) return;
      const stops = state.stopCounts.get(id) || 0;

      let msg = `"${r.name}" 코스를 삭제할까요?`;
      if (stops > 0) {
        msg += `\n\n⚠ 이 코스에는 납품처 ${stops}개가 등록되어 있습니다.\n` +
               `코스를 삭제하면 납품처도 함께 삭제됩니다 (되돌릴 수 없음).`;
      }
      const ok = await confirmDialog(msg, { okText: '삭제', cancelText: '취소', danger: true });
      if (!ok) return;

      try {
        const { error } = await supabase.from('routes').delete().eq('center_code', getRequiredCenter().code).eq('id', id);
        if (error) {
          toast(`삭제 실패: ${error.message}`, 'error');
          return;
        }
        toast('삭제되었습니다.', 'success');
        await loadRoutes();
        applyAndRender();
      } catch {
        toast('삭제 중 오류가 발생했습니다.', 'error');
      }
    }

    // -------------------------------------------------------------------------
    // 헬퍼
    // -------------------------------------------------------------------------

    function closedDaysRenderer(params) {
      const container = document.createElement('div');
      container.className = 'route-grid-days';
      if (!params.data.closedDays.length) {
        container.textContent = '-';
        container.style.color = '#52525b';
        return container;
      }
      const labels = ['일','월','화','수','목','금','토'];
      for (const day of params.data.closedDays) {
        const badge = document.createElement('span');
        badge.className = 'route-grid-day';
        badge.textContent = labels[day] ?? day;
        container.append(badge);
      }
      return container;
    }

    function statusRenderer(params) {
      const status = document.createElement('span');
      status.className = 'text-xs';
      status.style.color = params.value === '비활성' ? '#a51e36' : '#08634f';
      status.textContent = params.value;
      return status;
    }

    function actionRenderer(params) {
      const container = document.createElement('div');
      container.className = 'route-grid-actions';
      const actions = [
        ['납품처 ' + params.data.stopCount, () => openRouteStopsPopup(params.data.id), ' route-action-stops'],
        ['편집', () => openRouteForm(params.data.route), ''],
        ['삭제', () => deleteRoute(params.data.id), ' route-action-delete']
      ];
      for (const [label, action, extraClass] of actions) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'btn btn-ghost text-xs' + extraClass;
        button.textContent = label;
        button.setAttribute('aria-label', `${params.data.routeName || params.data.carNumber || '코스'} ${label}`);
        button.addEventListener('click', event => {
          event.stopPropagation();
          action();
        });
        container.append(button);
      }
      return container;
    }
    function nullIfEmpty(v) { return v === '' || v == null ? null : v; }
    function escapeHtml(s) {
      return String(s ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;')
        .replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
    }
    function escapeAttr(s) { return escapeHtml(s); }
    function debounce(fn, wait) {
      let t = null;
      return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), wait); };
    }
  </script>
</body>
</html>
