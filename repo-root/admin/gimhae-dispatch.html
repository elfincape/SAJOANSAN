<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>김해 배차 요청 · 이안물류</title>
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/workspace-ui.css" />
    <link rel="stylesheet" href="/css/admin-workspace.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/gimhae-dispatch.css" />
    <script type="module" src="/js/theme.js"></script>
    <script type="module" src="/js/admin-workspace.js"></script>
  </head>
  <body class="workspace-ui work-shell">
    <header>
      <a href="/admin/">관리 허브</a>
      <h1>김해 배차 요청</h1>
    </header>
    <main id="gm-app">
      <div id="gm-work" hidden>
        <div class="gm-toolbar gm-topbar">
          <label
            >기준날짜<input id="gm-date" type="date" required data-edit
          /></label>
          <button id="gm-new" class="btn btn-ghost" data-edit>새 작업</button>
          <span id="gm-center" class="gm-muted"></span>
        </div>
        <section class="gm-fixed-strip" aria-labelledby="gm-fixed-title">
          <h3 id="gm-fixed-title">고정기사</h3>
          <div
            id="gm-fixed-today"
            class="gm-fixed-today"
            aria-label="오늘 배차에 포함할 고정기사"
          ></div>
          <span id="gm-fixed-empty" class="gm-empty">등록 없음</span>
          <button id="gm-add-fixed" class="btn btn-ghost" data-edit>
            고정기사 등록
          </button>
          <span id="gm-fixed-status" class="gm-muted" role="status"></span>
          <button id="gm-fixed-retry" class="btn btn-ghost" hidden>
            다시 불러오기
          </button>
        </section>
        <div class="gm-flow">
          <section
            class="gm-stage gm-source-band"
            aria-labelledby="gm-source-title"
          >
            <div class="gm-source">
              <div class="gm-section-head">
                <h3 id="gm-source-title">
                  <span class="gm-step">1</span> CJ 요청
                </h3>
                <button
                  id="gm-undo"
                  class="btn btn-ghost gm-icon"
                  aria-label="이전 요청 복원"
                  title="이전 요청 복원"
                  hidden
                  data-edit
                >
                  &#8630;
                </button>
              </div>
              <button
                id="gm-paste"
                class="gm-paste"
                aria-label="CJ 요청 사진 붙여넣기"
                data-edit
              >
                <span id="gm-image-empty">사진 붙여넣기</span
                ><img id="gm-image" alt="CJ 요청 원본" hidden />
              </button>
              <div class="gm-analysis-state">
                <span id="gm-photo-state" role="status"></span>
                <button id="gm-view-photo" class="btn btn-ghost" hidden>
                  원본 보기
                </button>
                <button
                  id="gm-retry-photo"
                  class="btn btn-ghost"
                  hidden
                  data-edit
                >
                  다시 시도
                </button>
              </div>
            </div>
            <div class="gm-request-summary">
              <p id="gm-count" class="gm-muted"></p>
              <div id="gm-summary"></div>
              <p id="gm-request-empty" class="gm-empty">CJ 요청 대기</p>
              <div id="gm-haul" role="status" aria-live="polite" hidden></div>
            </div>
          </section>
          <section class="gm-stage" aria-labelledby="gm-carrier-title">
            <div class="gm-section-head">
              <h3 id="gm-carrier-title">
                <span class="gm-step">2</span> 운수사 요청
              </h3>
            </div>
            <div id="gm-request-issues" class="gm-issues" role="status"></div>
            <div id="gm-carrier-messages" class="gm-messages gm-carriers"></div>
          </section>
          <section
            class="gm-stage gm-reply-band"
            aria-labelledby="gm-reply-title"
          >
            <div class="gm-section-head">
              <h3 id="gm-reply-title">
                <span class="gm-step">3</span> 운수사 회신
              </h3>
              <span id="gm-reply-count" class="gm-muted"></span>
            </div>
            <div class="gm-reply-source">
              <textarea
                id="gm-reply"
                rows="7"
                maxlength="40000"
                aria-label="운수사 회신 원문"
                placeholder="회신 붙여넣기"
                data-edit
              ></textarea>
              <div class="gm-reply-actions">
                <label
                  >목적지 보완<select id="gm-reply-region" data-edit>
                    <option value="">원문 기준</option>
                    <option>광주</option>
                    <option>전주</option>
                    <option>하양</option>
                  </select></label
                >
                <button id="gm-apply-reply" class="btn btn-primary" data-edit>
                  회신 분석
                </button>
                <span id="gm-reply-state" role="status" class="gm-muted"></span>
              </div>
            </div>
          </section>
          <section class="gm-stage gm-cj-band" aria-labelledby="gm-cj-title">
            <div class="gm-section-head">
              <h3 id="gm-cj-title"><span class="gm-step">4</span> CJ 전달</h3>
            </div>
            <div id="gm-issues" class="gm-issues" role="status"></div>
            <div id="gm-cj-messages" class="gm-messages"></div>
          </section>
        </div>
        <details id="gm-truck-details" class="gm-settings gm-band">
          <summary>차량별 배차정보</summary>
          <div class="gm-scroll">
            <table class="gm-trucks-table">
              <thead>
                <tr>
                  <th>요청 연결</th>
                  <th>도크</th>
                  <th>기사</th>
                  <th>차량번호</th>
                  <th>연락처</th>
                  <th>입차시간</th>
                  <th>상차량·조건</th>
                  <th>관리</th>
                </tr>
              </thead>
              <tbody id="gm-trucks"></tbody>
            </table>
          </div>
          <p id="gm-truck-empty" class="gm-empty">배차정보 대기</p>
        </details>
      </div>
      <p id="gm-status" role="status" aria-live="polite">로그인 확인 중</p>
      <dialog id="gm-preview-dialog" aria-labelledby="gm-preview-title">
        <div class="gm-section-head">
          <h3 id="gm-preview-title">원본</h3>
          <button id="gm-close-preview" class="btn btn-ghost">닫기</button>
        </div>
        <img id="gm-preview-image" alt="CJ 요청 원본 확대" hidden />
        <textarea
          id="gm-preview-text"
          aria-label="전달문 전문"
          readonly
          hidden
        ></textarea>
      </dialog>
      <dialog id="gm-fixed-dialog" aria-labelledby="gm-fixed-dialog-title">
        <form id="gm-fixed-form">
          <h3 id="gm-fixed-dialog-title">고정기사 등록</h3>
          <div class="gm-fixed-fields">
            <label
              >지역<select name="region">
                <option>광주</option>
                <option>전주</option>
                <option>하양</option>
              </select></label
            >
            <label
              >운수사<select name="carrier">
                <option value="">공통</option>
                <option>광신</option>
                <option>동진</option>
                <option>해피</option>
              </select></label
            >
            <label>도크<select name="dock"></select></label>
            <label
              >기사명<input
                name="driver"
                required
                maxlength="80"
                autocomplete="off"
            /></label>
            <label
              >차량번호<input
                name="vehicle"
                required
                maxlength="40"
                autocomplete="off"
            /></label>
            <label
              >연락처<input
                name="phone"
                type="tel"
                required
                maxlength="40"
                autocomplete="off"
            /></label>
            <label
              >입차시간<input name="arrival" maxlength="80" placeholder="선택"
            /></label>
          </div>
          <p id="gm-fixed-error" class="gm-issues" role="alert"></p>
          <button
            id="gm-refresh-fixed"
            type="button"
            class="btn btn-ghost"
            hidden
          >
            최신 기사정보 불러오기
          </button>
          <div class="gm-dialog-actions">
            <button
              id="gm-delete-fixed"
              type="button"
              class="btn btn-ghost"
              hidden
            >
              등록 삭제
            </button>
            <button id="gm-cancel-fixed" type="button" class="btn btn-ghost">
              취소
            </button>
            <button id="gm-submit-fixed" type="submit" class="btn btn-primary">
              등록
            </button>
          </div>
        </form>
      </dialog>
    </main>
    <script type="module" src="/js/gimhae-dispatch-ui.js"></script>
  </body>
</html>
