<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>김해 배차 요청 · 이안물류</title>
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/workspace-ui.css" />
    <link rel="stylesheet" href="/css/admin-workspace.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/gimhae-dispatch.css" />
    <script type="module" src="/js/theme.js"></script>
    <script type="module" src="/js/admin-workspace.js"></script>
  </head>
  <body class="workspace-ui work-shell">
    <header>
      <a href="/admin/">관리 허브</a>
      <h1>김해 배차 요청</h1>
    </header>
    <main id="gm-app">
      <div class="gm-heading">
        <div>
          <h2>김해 배차 요청</h2>
          <span id="gm-center" class="gm-muted"></span>
        </div>
        <span id="gm-saved" class="gm-badge">새 작업</span>
      </div>
      <p id="gm-status" role="status" aria-live="polite">로그인 확인 중</p>
      <div id="gm-work" hidden>
        <div class="gm-toolbar gm-topbar">
          <label
            >기준날짜<input id="gm-date" type="date" required data-edit
          /></label>
          <button id="gm-save" class="btn btn-primary" data-edit>저장</button>
          <button id="gm-save-copy" class="btn btn-ghost" data-edit>
            사본 저장
          </button>
          <button id="gm-new" class="btn btn-ghost" data-edit>새 작업</button>
          <label class="gm-history"
            >내 저장 내역<select id="gm-history">
              <option value="">선택</option>
            </select></label
          >
          <button id="gm-load" class="btn btn-ghost">불러오기</button>
        </div>
        <section class="gm-source-band" aria-labelledby="gm-source-title">
          <div class="gm-source">
            <div class="gm-section-head">
              <h3 id="gm-source-title">CJ 요청 사진</h3>
              <button
                id="gm-undo"
                class="btn btn-ghost gm-icon"
                aria-label="이전 요청 복원"
                title="이전 요청 복원"
                hidden
                data-edit
              >
                &#8630;
              </button>
            </div>
            <button
              id="gm-paste"
              class="gm-paste"
              aria-label="CJ 요청 사진 붙여넣기"
              data-edit
            >
              <span id="gm-image-empty">사진 붙여넣기</span
              ><img id="gm-image" alt="CJ 요청 원본" hidden />
            </button>
            <div class="gm-analysis-state">
              <span id="gm-photo-state" role="status"></span>
              <button
                id="gm-retry-photo"
                class="btn btn-ghost"
                hidden
                data-edit
              >
                다시 시도
              </button>
            </div>
          </div>
          <div class="gm-request-summary">
            <div class="gm-section-head">
              <h3>요청 내역</h3>
              <span id="gm-count" class="gm-muted"></span>
            </div>
            <div class="gm-scroll">
              <table class="gm-summary-table">
                <thead>
                  <tr>
                    <th>지역</th>
                    <th>냉동</th>
                    <th>냉장</th>
                    <th>합계</th>
                    <th>CJ 요청</th>
                    <th>운수사</th>
                  </tr>
                </thead>
                <tbody id="gm-summary"></tbody>
              </table>
            </div>
            <p id="gm-request-empty" class="gm-empty">CJ 요청 대기</p>
            <div id="gm-haul" role="status" aria-live="polite" hidden></div>
            <div
              id="gm-fixed-today"
              class="gm-fixed-today"
              aria-label="오늘 고정기사"
            ></div>
            <details id="gm-fixed-settings" class="gm-settings">
              <summary>
                고정기사 설정
                <span id="gm-fixed-status" class="gm-muted"></span>
              </summary>
              <div class="gm-toolbar">
                <button id="gm-add-fixed" class="btn btn-ghost" data-edit>
                  기사 추가
                </button>
                <button id="gm-load-fixed" class="btn btn-ghost" data-edit>
                  기본값 불러오기
                </button>
                <button id="gm-save-fixed" class="btn btn-primary" data-edit>
                  기본값 저장
                </button>
              </div>
              <div class="gm-scroll">
                <table class="gm-fixed-table">
                  <thead>
                    <tr>
                      <th>지역</th>
                      <th>운수사</th>
                      <th>도크</th>
                      <th>기사</th>
                      <th>차량번호</th>
                      <th>연락처</th>
                      <th>입차시간</th>
                      <th>관리</th>
                    </tr>
                  </thead>
                  <tbody id="gm-fixed"></tbody>
                </table>
              </div>
              <p id="gm-fixed-empty" class="gm-empty">
                등록된 고정기사가 없습니다.
              </p>
            </details>
          </div>
        </section>
        <section class="gm-band" aria-labelledby="gm-carrier-title">
          <div class="gm-section-head">
            <h3 id="gm-carrier-title">운수사 요청</h3>
          </div>
          <div id="gm-request-issues" class="gm-issues" role="status"></div>
          <div id="gm-carrier-messages" class="gm-messages gm-carriers"></div>
        </section>
        <section class="gm-band" aria-labelledby="gm-reply-title">
          <div class="gm-section-head">
            <h3 id="gm-reply-title">운수사 회신</h3>
            <span id="gm-reply-count" class="gm-muted"></span>
          </div>
          <div class="gm-reply-source">
            <textarea
              id="gm-reply"
              rows="3"
              maxlength="40000"
              aria-label="운수사 회신 원문"
              placeholder="회신 붙여넣기"
              data-edit
            ></textarea>
            <div class="gm-reply-actions">
              <label
                >목적지 보완<select id="gm-reply-region" data-edit>
                  <option value="">원문 기준</option>
                  <option>광주</option>
                  <option>전주</option>
                  <option>하양</option>
                </select></label
              >
              <button
                id="gm-apply-reply"
                class="btn btn-ghost"
                hidden
                data-edit
              >
                회신 반영
              </button>
              <span id="gm-reply-state" role="status" class="gm-muted"></span>
            </div>
          </div>
          <details id="gm-truck-details" class="gm-settings">
            <summary>차량별 배차정보</summary>
            <div class="gm-scroll">
              <table class="gm-trucks-table">
                <thead>
                  <tr>
                    <th>요청 연결</th>
                    <th>도크</th>
                    <th>기사</th>
                    <th>차량번호</th>
                    <th>연락처</th>
                    <th>입차시간</th>
                    <th>상차량·조건</th>
                    <th>관리</th>
                  </tr>
                </thead>
                <tbody id="gm-trucks"></tbody>
              </table>
            </div>
            <p id="gm-truck-empty" class="gm-empty">배차정보 대기</p>
          </details>
        </section>
        <section class="gm-band" aria-labelledby="gm-cj-title">
          <div class="gm-section-head"><h3 id="gm-cj-title">CJ 전달</h3></div>
          <div id="gm-issues" class="gm-issues" role="status"></div>
          <div id="gm-cj-messages" class="gm-messages"></div>
        </section>
      </div>
    </main>
    <script type="module" src="/js/gimhae-dispatch-ui.js"></script>
  </body>
</html>
