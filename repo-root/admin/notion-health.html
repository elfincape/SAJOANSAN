<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>보건증 Notion 연동 · 관리 허브</title>
  <link rel="stylesheet" href="/css/common.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-900 text-zinc-100 min-h-screen">
  <header class="border-b border-zinc-800"><div class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-4">
    <h1 class="text-base font-semibold">보건증 Notion 연동</h1><div class="flex-1"></div>
    <a id="hub-link" href="/admin/" class="btn btn-ghost">관리 허브</a>
    <button id="logout-btn" class="btn btn-ghost">로그아웃</button>
  </div></header>
  <main class="max-w-3xl mx-auto px-4 py-8">
    <section class="rounded-lg border border-zinc-700 bg-zinc-800/40 p-5">
      <h2 class="text-lg font-semibold">연결 확인</h2>
      <p class="text-sm text-zinc-400 mt-2">보건증 갱신 목록의 접근 권한과 필요한 열을 확인합니다.</p>
      <div class="flex flex-wrap gap-3 mt-5">
        <button id="test-btn" class="btn btn-primary" disabled>연결 테스트</button>
        <a href="https://app.notion.com/p/46ceeb04f20842c1b9b246a3657c3b21" target="_blank" rel="noopener noreferrer" class="btn btn-ghost">Notion 목록 열기</a>
      </div>
      <p id="test-status" role="status" aria-live="polite" class="text-sm mt-5">로그인 확인 중…</p>
      <ul id="test-details" class="text-sm text-zinc-400 mt-3 space-y-1"></ul>
    </section>
    <section class="rounded-lg border border-zinc-700 bg-zinc-800/40 p-5 mt-5">
      <h2 class="text-lg font-semibold">보건증 관리 대상 동기화</h2>
      <p id="sync-center" class="text-sm text-zinc-400 mt-2">센터 확인 중…</p>
      <p class="text-sm text-zinc-400 mt-2">미등록·만료 임박·오늘 만료·만료 기사를 Notion에 반영합니다. 연락일, 갱신 예정일, 담당자와 메모는 보존합니다.</p>
      <p id="preview-status" role="status" aria-live="polite" class="text-sm mt-4">대상 조회 중…</p>
      <ul id="preview-counts" class="text-sm text-zinc-400 mt-2 space-y-1"></ul>
      <div class="flex flex-wrap gap-3 mt-5">
        <button id="preview-btn" class="btn btn-ghost" disabled>대상 새로고침</button>
        <button id="sync-btn" class="btn btn-primary" disabled>Notion 동기화</button>
      </div>
      <p id="sync-status" role="status" aria-live="polite" class="text-sm mt-4"></p>
      <ul id="sync-details" class="text-sm text-zinc-400 mt-2 space-y-1"></ul>
    </section>
    <p class="text-sm text-zinc-400 mt-5">현재 단계: 버튼으로 동기화. 자동 실행·알림·보건증 갱신 후 완료 처리는 다음 단계에서 설정합니다.</p>
  </main>
  <script type="module" src="/js/notion-health-ui.js"></script>
</body>
</html>
