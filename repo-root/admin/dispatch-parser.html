<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>배차정보 파서 · 코스표 관리 시스템</title>
  <link rel="stylesheet" href="/css/common.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ── 복사 가능 셀 ─────────────────────────────── */
    .copy-cell {
      cursor: pointer;
      user-select: none;
      position: relative;
    }
    .copy-cell:hover {
      background: rgba(16, 185, 129, 0.10) !important;
    }
    .copy-cell:active {
      background: rgba(16, 185, 129, 0.22) !important;
    }
    /* 호버 시 복사 아이콘 표시 */
    .copy-cell::after {
      content: '⎘';
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 10px;
      color: #10b981;
      opacity: 0;
      transition: opacity 0.12s;
      pointer-events: none;
    }
    .copy-cell:hover::after { opacity: 1; }

    /* ── 결과값 셀 특수 스타일 ─────────────────────── */
    .result-cell {
      max-width: 340px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── 토스트 ────────────────────────────────────── */
    #toast {
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    #toast.show {
      opacity: 1 !important;
      transform: translateX(-50%) translateY(0) !important;
    }

    /* ── textarea 모노 ─────────────────────────────── */
    #raw-input {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12.5px;
      line-height: 1.6;
      resize: vertical;
    }

    /* ── 파싱 오류 행 ──────────────────────────────── */
    .row-warn td { color: #f59e0b; }
  </style>
</head>
<body class="bg-zinc-900 text-zinc-100 min-h-screen flex flex-col">

  <!-- ── 헤더 ───────────────────────────────────────── -->
  <header class="border-b border-zinc-800 sticky top-0 z-30 bg-zinc-900/95 backdrop-blur">
    <div class="max-w-[1200px] mx-auto px-4 py-3 flex items-center gap-3">
      <a href="/admin/" class="text-xs text-zinc-400 hover:text-zinc-100 transition">← 관리 허브</a>
      <div class="flex items-center gap-2">
        <!-- 트럭 아이콘 -->
        <div class="w-7 h-7 rounded-md bg-sky-600/20 border border-sky-600/40 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-sky-400"
               fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M9 17H7a2 2 0 01-2-2V6a2 2 0 012-2h6a2 2 0 012 2v3M13 17h4m0 0a2 2 0 100-4h-4v4zm0 0H13"/>
          </svg>
        </div>
        <h1 class="text-base font-semibold">배차정보 파서</h1>
      </div>
      <div class="flex-1"></div>
      <span class="text-xs text-zinc-500 hidden sm:inline">타 운수사 배차 문자 파싱</span>
    </div>
  </header>

  <!-- ── 본문 ───────────────────────────────────────── -->
  <main class="flex-1 max-w-[1200px] w-full mx-auto px-4 py-6 flex flex-col gap-5">

    <!-- 입력 패널 -->
    <section class="border border-zinc-700 rounded-lg overflow-hidden">
      <div class="p-3 border-b border-zinc-700 bg-zinc-800/50 flex flex-wrap items-center gap-2">
        <div class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-sky-400"></span>
          <span class="text-sm font-medium">배차 원문</span>
        </div>
        <p class="text-xs text-zinc-400 hidden sm:inline">타 운수사 문자를 그대로 붙여넣으세요</p>
        <div class="flex-1"></div>
        <button id="sample-btn" class="btn btn-ghost text-xs">예시 불러오기</button>
        <button id="clear-btn"  class="btn btn-ghost text-xs">지우기</button>
        <button id="parse-btn"  class="btn btn-primary">▶ 파싱 실행</button>
      </div>
      <div class="p-3">
        <textarea id="raw-input" class="app-textarea w-full" rows="9"
          placeholder="예)
오산 5톤 /후레스써브
조하영 인천84바4522
010-8907-9981 / 태강 1톤
임종문 경기86아5643
010-3376-3584 / 금천미성+오케이 경유 5톤
조현구 경기84바2476
010-4735-3138 / 인천12/B2B 5톤
황인호 경기96자8024
01091400820"></textarea>
      </div>
      <div class="px-3 pb-2 text-xs text-zinc-500">
        ※ 레코드 구분자 <code> / </code> (공백-슬래시-공백) · 레코드 1건 = 거래처+톤수 / 기사+차량 / 연락처 (3줄 구조)
        &nbsp;|&nbsp; <kbd class="bg-zinc-700 px-1 py-0.5 rounded text-zinc-300">Ctrl</kbd>+<kbd class="bg-zinc-700 px-1 py-0.5 rounded text-zinc-300">Enter</kbd> 로 파싱
      </div>
    </section>

    <!-- 결과 패널 -->
    <section id="result-section" class="border border-zinc-700 rounded-lg overflow-hidden hidden">
      <div class="p-3 border-b border-zinc-700 bg-zinc-800/50 flex flex-wrap items-center gap-2">
        <div class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
          <span class="text-sm font-medium">파싱 결과</span>
        </div>
        <span id="result-count" class="text-xs px-1.5 py-0.5 rounded bg-zinc-700 text-zinc-300"></span>
        <div class="flex-1"></div>
        <button id="copy-tsv-btn"  class="btn btn-ghost text-xs" title="행 전체를 탭 구분으로 복사 (엑셀 붙여넣기용)">전체 TSV 복사</button>
        <button id="copy-all-btn"  class="btn btn-ghost text-xs" title="쉼표 구분 전체 결과값 복사">전체 결과값 복사</button>
      </div>

      <!-- 결과 테이블 -->
      <div class="overflow-x-auto">
        <table class="app-table">
          <thead>
            <tr>
              <th class="w-8 text-center text-zinc-500">#</th>
              <th>거래처명</th>
              <th class="w-14 text-center">톤수</th>
              <th>기사명</th>
              <th>차량번호</th>
              <th>연락처</th>
              <th>결과값 (클릭하여 복사)</th>
            </tr>
          </thead>
          <tbody id="result-body"></tbody>
        </table>
      </div>

      <!-- 안내 -->
      <div class="p-3 border-t border-zinc-700 bg-zinc-800/30 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-zinc-400 shrink-0"
             fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M13 16h-1v-4h-1m1-4h.01M12 2a10 10 0 100 20 10 10 0 000-20z"/>
        </svg>
        <p class="text-xs text-zinc-400">
          각 셀을 클릭하면 해당 값이 클립보드에 복사됩니다.
          엑셀·구글 스프레드시트에 바로 붙여넣기 가능합니다.
        </p>
      </div>
    </section>

  </main>

  <!-- ── 토스트 알림 ──────────────────────────────────── -->
  <div id="toast"
       class="fixed bottom-6 left-1/2 z-50 pointer-events-none opacity-0
              -translate-x-1/2 translate-y-2
              bg-zinc-700 border border-zinc-600 text-zinc-100
              text-xs px-4 py-2 rounded-full shadow-xl flex items-center gap-1.5">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-emerald-400"
         fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
    </svg>
    <span id="toast-msg">복사됨</span>
  </div>

  <!-- ── 스크립트 ─────────────────────────────────────── -->
  <script>
  'use strict';

  /* ══════════════════════════════════════════════════════════
     1. 파서 핵심 로직
     ══════════════════════════════════════════════════════════ */

  /**
   * 전화번호 정규화
   * "01091400820" → "010-9140-0820"
   */
  function normalizePhone(raw) {
    const digits = raw.replace(/\D/g, '');
    if (digits.length === 11 && digits.startsWith('010')) {
      return `${digits.slice(0,3)}-${digits.slice(3,7)}-${digits.slice(7)}`;
    }
    if (digits.length === 11) {
      // 016, 017, 018, 019 등
      return `${digits.slice(0,3)}-${digits.slice(3,6)}-${digits.slice(6)}`;
    }
    if (digits.length === 10) {
      return `${digits.slice(0,3)}-${digits.slice(3,6)}-${digits.slice(6)}`;
    }
    return raw.trim(); // 이상한 형식이면 그대로
  }

  /**
   * 거래처명 + 톤수 파싱
   * - 공백+슬래시 이후는 제거 ("오산 5톤 /후레스써브" → "오산 5톤")
   * - "경유" 키워드 제거
   * - N톤 패턴 추출
   * - 이름 내 "/" → "+" 변환
   */
  function parseNameTon(line) {
    // 공백 뒤 슬래시가 오면 이전 부분만 사용
    const beforeAltSlash = line.split(/\s\/(?!\s*\d)/)[0];   // " /한글숫자" 제거
    // 추가로 단순 " /" 도 처리
    const beforeSlash = beforeAltSlash.split(/\s\//)[0].trim();

    // "경유" 제거
    const cleaned = beforeSlash.replace(/\s*경유\s*/g, ' ').replace(/\s+/g, ' ').trim();

    // N톤 (소수점 포함) 추출
    const tonMatch = cleaned.match(/(\d+(?:\.\d+)?톤)/);
    const ton = tonMatch ? tonMatch[1] : '';

    // 거래처명: 톤수 앞부분 정리, "/" → "+"
    let name = ton
      ? cleaned.slice(0, cleaned.indexOf(ton)).trim()
      : cleaned;
    name = name.replace(/\//g, '+').trim();

    return { name, ton };
  }

  /**
   * 기사명 + 차량번호 파싱
   * "조하영 인천84바4522" → { driver: '조하영', vehicle: '인천84바4522' }
   */
  function parseDriverVehicle(line) {
    const parts = line.trim().split(/\s+/);
    return {
      driver:  parts[0] || '',
      vehicle: parts[1] || ''
    };
  }

  /**
   * 전체 RAW 텍스트 파싱
   * 반환: [{ name, ton, driver, vehicle, phone, _warn? }]
   */
  function parseDispatch(raw) {
    // 줄바꿈 정규화
    const text = raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

    /* 레코드 구분자: 공백+슬래시+공백(또는 줄바꿈)
       단, 이름 내부의 "/" 는 공백 없이 붙어있어 구분 가능
       예: " / "  " /\n"  — 매칭
           "12/B2B" — 매칭 안 됨 (공백 없음)                       */
    const chunks = text.split(/[ \t]\/(?=[ \t\n])/);

    const results = [];

    for (const raw_chunk of chunks) {
      const lines = raw_chunk
        .split('\n')
        .map(l => l.trim())
        .filter(l => l.length > 0);

      if (lines.length < 3) continue; // 불완전 레코드 건너뜀

      const { name, ton }       = parseNameTon(lines[0]);
      const { driver, vehicle } = parseDriverVehicle(lines[1]);
      const phone               = normalizePhone(lines[2]);

      // 최소 검증
      if (!name) continue;

      const warn = !driver || !vehicle || !ton;
      results.push({ name, ton, driver, vehicle, phone, _warn: warn });
    }

    return results;
  }

  /* ══════════════════════════════════════════════════════════
     2. UI
     ══════════════════════════════════════════════════════════ */

  const SAMPLE_RAW = `오산 5톤 /후레스써브
조하영 인천84바4522
010-8907-9981 / 태강 1톤
임종문 경기86아5643
010-3376-3584 / 금천미성+오케이 경유 5톤
조현구 경기84바2476
010-4735-3138 / 인천12/B2B 5톤
황인호 경기96자8024
01091400820`;

  const el = id => document.getElementById(id);

  el('sample-btn').onclick = () => {
    el('raw-input').value = SAMPLE_RAW;
    el('raw-input').focus();
  };
  el('clear-btn').onclick = () => {
    el('raw-input').value = '';
    el('result-section').classList.add('hidden');
    el('raw-input').focus();
  };
  el('parse-btn').onclick = runParse;

  // Ctrl/Cmd + Enter → 파싱
  el('raw-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      runParse();
    }
  });

  /* ─── 파싱 실행 ─────────────────────────────────── */
  function runParse() {
    const raw = el('raw-input').value;
    if (!raw.trim()) {
      showToast('원문을 입력하세요', true);
      return;
    }
    const records = parseDispatch(raw);
    renderResults(records);
  }

  /* ─── 결과 렌더링 ────────────────────────────────── */
  function renderResults(records) {
    const section = el('result-section');
    const body    = el('result-body');
    const count   = el('result-count');

    count.textContent = `${records.length}건`;

    if (records.length === 0) {
      body.innerHTML = `
        <tr>
          <td colspan="7" class="text-center text-zinc-400 py-8 text-sm">
            파싱된 데이터가 없습니다.<br>
            <span class="text-xs text-zinc-500 mt-1 block">
              레코드 구분자 <code> / </code> 와 3줄 구조를 확인하세요.
            </span>
          </td>
        </tr>`;
      section.classList.remove('hidden');
      return;
    }

    body.innerHTML = records.map((r, i) => {
      const resultVal = `${r.name}\\${r.ton}\\${r.driver}\\${r.vehicle}\\${r.phone}`;
      const rowClass  = r._warn ? 'row-warn' : '';
      return `
        <tr class="${rowClass}">
          <td class="text-center text-zinc-500 text-xs select-none">${i + 1}</td>
          <td class="copy-cell font-medium"         data-val="${esc(r.name)}">${esc(r.name)}</td>
          <td class="copy-cell text-center text-zinc-300" data-val="${esc(r.ton)}">${esc(r.ton) || '<span class="text-zinc-600">-</span>'}</td>
          <td class="copy-cell"                     data-val="${esc(r.driver)}">${esc(r.driver) || '<span class="text-zinc-600">-</span>'}</td>
          <td class="copy-cell font-mono text-xs"   data-val="${esc(r.vehicle)}">${esc(r.vehicle) || '<span class="text-zinc-600">-</span>'}</td>
          <td class="copy-cell font-mono text-xs"   data-val="${esc(r.phone)}">${esc(r.phone) || '<span class="text-zinc-600">-</span>'}</td>
          <td class="copy-cell result-cell text-emerald-400 font-mono text-xs" data-val="${esc(resultVal)}"
              title="${esc(resultVal)}">${esc(resultVal)}</td>
        </tr>`;
    }).join('');

    // 셀 클릭 이벤트
    body.querySelectorAll('.copy-cell').forEach(cell => {
      cell.addEventListener('click', () => {
        const val = cell.dataset.val;
        if (val) copyToClipboard(val, val.length > 30 ? '결과값 복사됨' : `"${val}" 복사됨`);
      });
    });

    section.classList.remove('hidden');
    section.scrollIntoView({ behavior: 'smooth', block: 'start' });

    // 전체 결과값 복사 (쉼표 구분)
    el('copy-all-btn').onclick = () => {
      const all = records
        .map(r => `${r.name}\\${r.ton}\\${r.driver}\\${r.vehicle}\\${r.phone}`)
        .join(',');
      copyToClipboard(all, `전체 ${records.length}건 복사됨`);
    };

    // 전체 TSV 복사 (엑셀 붙여넣기)
    el('copy-tsv-btn').onclick = () => {
      const header = '거래처명\t톤수\t기사명\t차량번호\t연락처';
      const rows   = records.map(r =>
        [r.name, r.ton, r.driver, r.vehicle, r.phone].join('\t')
      );
      copyToClipboard([header, ...rows].join('\n'), `전체 ${records.length}건 TSV 복사됨`);
    };
  }

  /* ─── 클립보드 ──────────────────────────────────── */
  let toastTimer = null;
  function copyToClipboard(text, message = '복사됨') {
    navigator.clipboard.writeText(text).then(() => {
      showToast(message);
    }).catch(() => {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast(message);
    });
  }

  function showToast(msg, isError = false) {
    const toast   = el('toast');
    const toastEl = el('toast-msg');
    toastEl.textContent = msg;
    toast.style.borderColor = isError ? '#ef4444' : '';
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
  }

  /* ─── HTML 이스케이프 ────────────────────────────── */
  function esc(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  </script>

</body>
</html>
