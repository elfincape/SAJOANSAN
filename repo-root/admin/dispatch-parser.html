<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>배차정보 파서 · 코스표 관리 시스템</title>
  <link rel="stylesheet" href="/css/common.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ── 토스트 ────────────────────────────────────── */
    #toast {
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    #toast.show {
      opacity: 1 !important;
      transform: translateX(-50%) translateY(0) !important;
    }

    /* ── textarea 모노 ─────────────────────────────── */
    #raw-input {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12.5px;
      line-height: 1.6;
      resize: vertical;
    }

    /* ── 컬럼 헤더 (클릭으로 열 전체 복사) ────────── */
    th.col-copy {
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    th.col-copy:hover {
      background: rgba(16, 185, 129, 0.15) !important;
      color: #10b981;
    }
    th.col-copy:active {
      background: rgba(16, 185, 129, 0.28) !important;
    }
    th.col-copy .copy-icon {
      margin-left: 4px;
      font-size: 10px;
      opacity: 0.4;
      transition: opacity 0.12s;
    }
    th.col-copy:hover .copy-icon {
      opacity: 1;
    }

    /* ── 결과값 셀 말줄임 ──────────────────────────── */
    .result-cell {
      max-width: 340px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── 파싱 경고 행 ──────────────────────────────── */
    .row-warn td { color: #f59e0b; }
  </style>
</head>
<body class="bg-zinc-900 text-zinc-100 min-h-screen flex flex-col">

  <!-- ── 헤더 ───────────────────────────────────────── -->
  <header class="border-b border-zinc-800 sticky top-0 z-30 bg-zinc-900/95 backdrop-blur">
    <div class="max-w-[1200px] mx-auto px-4 py-3 flex items-center gap-3">
      <a href="/admin/" class="text-xs text-zinc-400 hover:text-zinc-100 transition">← 관리 허브</a>
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-md bg-sky-600/20 border border-sky-600/40 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-sky-400"
               fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M4 6h16M4 12h10M4 18h7M15 15l2 2 4-4"/>
          </svg>
        </div>
        <h1 class="text-base font-semibold">배차정보 파서</h1>
      </div>
      <div class="flex-1"></div>
      <a href="/" class="btn btn-ghost">대시보드</a>
    </div>
  </header>

  <!-- ── 본문 ───────────────────────────────────────── -->
  <main class="flex-1 max-w-[1200px] w-full mx-auto px-4 py-6 flex flex-col gap-5">

    <!-- 입력 패널 -->
    <section class="border border-zinc-700 rounded-lg overflow-hidden">
      <div class="p-3 border-b border-zinc-700 bg-zinc-800/50 flex flex-wrap items-center gap-2">
        <div class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-sky-400"></span>
          <span class="text-sm font-medium">배차 원문</span>
        </div>
        <p class="text-xs text-zinc-400 hidden sm:inline">타 운수사 문자를 그대로 붙여넣으세요</p>
        <div class="flex-1"></div>
        <button id="clear-btn" class="btn btn-ghost text-xs">지우기</button>
        <button id="parse-btn" class="btn btn-primary">▶ 파싱 실행</button>
      </div>
      <div class="p-3">
        <textarea id="raw-input" class="app-textarea w-full" rows="9"
          placeholder="타 운수사에서 받은 배차 정보를 여기에 붙여넣으세요."></textarea>
      </div>
      <div class="px-3 pb-2 text-xs text-zinc-500">
        ※ 레코드 구분자 <code> / </code> (공백·슬래시·공백) &nbsp;|&nbsp;
        <kbd class="bg-zinc-700 px-1 py-0.5 rounded text-zinc-300">Ctrl</kbd>+<kbd class="bg-zinc-700 px-1 py-0.5 rounded text-zinc-300">Enter</kbd> 로 파싱
      </div>
    </section>

    <!-- 결과 패널 -->
    <section id="result-section" class="border border-zinc-700 rounded-lg overflow-hidden hidden">
      <div class="p-3 border-b border-zinc-700 bg-zinc-800/50 flex flex-wrap items-center gap-2">
        <div class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
          <span class="text-sm font-medium">파싱 결과</span>
        </div>
        <span id="result-count" class="text-xs px-1.5 py-0.5 rounded bg-zinc-700 text-zinc-300"></span>
        <div class="flex-1"></div>
        <button id="copy-tsv-btn" class="btn btn-ghost text-xs">전체 TSV 복사</button>
        <button id="copy-all-btn" class="btn btn-ghost text-xs">전체 결과값 복사</button>
      </div>

      <!-- 결과 테이블 -->
      <div class="overflow-x-auto">
        <table class="app-table">
          <thead>
            <tr>
              <th class="w-8 text-center text-zinc-500 select-none">#</th>
              <!-- data-col : 해당 열의 레코드 키 -->
              <th class="col-copy" data-col="name">거래처명<span class="copy-icon">⎘</span></th>
              <th class="col-copy w-14 text-center" data-col="ton">톤수<span class="copy-icon">⎘</span></th>
              <th class="col-copy" data-col="driver">기사명<span class="copy-icon">⎘</span></th>
              <th class="col-copy" data-col="vehicle">차량번호<span class="copy-icon">⎘</span></th>
              <th class="col-copy" data-col="phone">연락처<span class="copy-icon">⎘</span></th>
              <th class="col-copy" data-col="result">결과값<span class="copy-icon">⎘</span></th>
            </tr>
          </thead>
          <tbody id="result-body"></tbody>
        </table>
      </div>

      <!-- 안내 -->
      <div class="p-3 border-t border-zinc-700 bg-zinc-800/30 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-zinc-400 shrink-0"
             fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M13 16h-1v-4h-1m1-4h.01M12 2a10 10 0 100 20 10 10 0 000-20z"/>
        </svg>
        <p class="text-xs text-zinc-400">
          열 제목(거래처명·톤수·기사명·차량번호·연락처·결과값)을 클릭하면
          해당 열의 전체 값이 복사됩니다. 엑셀·스프레드시트에 바로 붙여넣기 가능합니다.
        </p>
      </div>
    </section>

  </main>

  <!-- ── 토스트 알림 ──────────────────────────────────── -->
  <div id="toast"
       class="fixed bottom-6 left-1/2 z-50 pointer-events-none opacity-0
              -translate-x-1/2 translate-y-2
              bg-zinc-700 border border-zinc-600 text-zinc-100
              text-xs px-4 py-2 rounded-full shadow-xl flex items-center gap-1.5">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-emerald-400"
         fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
    </svg>
    <span id="toast-msg">복사됨</span>
  </div>

  <!-- ── 스크립트 ─────────────────────────────────────── -->
  <script>
  'use strict';

  /* ══════════════════════════════════════════════════════════
     1. 파서 핵심 로직
     ══════════════════════════════════════════════════════════ */

  function normalizePhone(raw) {
    const digits = raw.replace(/\D/g, '');
    if (digits.length === 11 && digits.startsWith('010'))
      return `${digits.slice(0,3)}-${digits.slice(3,7)}-${digits.slice(7)}`;
    if (digits.length === 11)
      return `${digits.slice(0,3)}-${digits.slice(3,6)}-${digits.slice(6)}`;
    if (digits.length === 10)
      return `${digits.slice(0,3)}-${digits.slice(3,6)}-${digits.slice(6)}`;
    return raw.trim();
  }

  function parseNameTon(line) {
    const beforeAltSlash = line.split(/\s\/(?!\s*\d)/)[0];
    const beforeSlash    = beforeAltSlash.split(/\s\//)[0].trim();
    const cleaned = beforeSlash.replace(/\s*경유\s*/g, ' ').replace(/\s+/g, ' ').trim();
    const tonMatch = cleaned.match(/(\d+(?:\.\d+)?톤)/);
    const ton = tonMatch ? tonMatch[1] : '';
    let name = ton ? cleaned.slice(0, cleaned.indexOf(ton)).trim() : cleaned;
    name = name.replace(/\//g, '+').trim();
    return { name, ton };
  }

  function parseDriverVehicle(line) {
    const parts = line.trim().split(/\s+/);
    return { driver: parts[0] || '', vehicle: parts[1] || '' };
  }

  function parseDispatch(raw) {
    const text   = raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    const chunks = text.split(/[ \t]\/(?=[ \t\n])/);
    const results = [];
    for (const chunk of chunks) {
      const lines = chunk.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length < 3) continue;
      const { name, ton }       = parseNameTon(lines[0]);
      const { driver, vehicle } = parseDriverVehicle(lines[1]);
      const phone               = normalizePhone(lines[2]);
      if (!name) continue;
      results.push({ name, ton, driver, vehicle, phone, _warn: !driver || !vehicle || !ton });
    }
    return results;
  }

  /* ══════════════════════════════════════════════════════════
     2. UI
     ══════════════════════════════════════════════════════════ */

  // 파싱된 레코드를 전역으로 보관 (헤더 클릭 시 참조)
  let _records = [];

  const el = id => document.getElementById(id);

  el('clear-btn').onclick = () => {
    el('raw-input').value = '';
    el('result-section').classList.add('hidden');
    _records = [];
    el('raw-input').focus();
  };
  el('parse-btn').onclick = runParse;

  el('raw-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      runParse();
    }
  });

  /* ─── 파싱 실행 ─────────────────────────────────── */
  function runParse() {
    const raw = el('raw-input').value;
    if (!raw.trim()) { showToast('원문을 입력하세요', true); return; }
    _records = parseDispatch(raw);
    renderResults(_records);
  }

  /* ─── 결과 렌더링 ────────────────────────────────── */
  function renderResults(records) {
    const section = el('result-section');
    const body    = el('result-body');
    el('result-count').textContent = `${records.length}건`;

    if (records.length === 0) {
      body.innerHTML = `
        <tr><td colspan="7" class="text-center text-zinc-400 py-8 text-sm">
          파싱된 데이터가 없습니다.<br>
          <span class="text-xs text-zinc-500 mt-1 block">레코드 구분자 <code> / </code> 와 3줄 구조를 확인하세요.</span>
        </td></tr>`;
      section.classList.remove('hidden');
      return;
    }

    body.innerHTML = records.map((r, i) => {
      const rv = `${r.name}\\${r.ton}\\${r.driver}\\${r.vehicle}\\${r.phone}`;
      return `
        <tr class="${r._warn ? 'row-warn' : ''}">
          <td class="text-center text-zinc-500 text-xs select-none">${i + 1}</td>
          <td class="font-medium">${esc(r.name)}</td>
          <td class="text-center text-zinc-300">${esc(r.ton) || '<span class="text-zinc-600">-</span>'}</td>
          <td>${esc(r.driver) || '<span class="text-zinc-600">-</span>'}</td>
          <td class="font-mono text-xs">${esc(r.vehicle) || '<span class="text-zinc-600">-</span>'}</td>
          <td class="font-mono text-xs">${esc(r.phone) || '<span class="text-zinc-600">-</span>'}</td>
          <td class="result-cell text-emerald-400 font-mono text-xs" title="${esc(rv)}">${esc(rv)}</td>
        </tr>`;
    }).join('');

    // ── 열 헤더 클릭 → 해당 열 전체 값 복사 ──────────
    document.querySelectorAll('th.col-copy').forEach(th => {
      th.onclick = () => {
        const col = th.dataset.col;
        const vals = records
          .map(r => {
            if (col === 'result') return `${r.name}\\${r.ton}\\${r.driver}\\${r.vehicle}\\${r.phone}`;
            return r[col] || '';
          })
          .filter(v => v.length > 0);

        if (!vals.length) return;
        // 줄바꿈 구분 → 엑셀에 붙여넣으면 행별로 분리됨
        copyToClipboard(vals.join('\n'), `${th.textContent.replace('⎘','').trim()} ${vals.length}건 복사됨`);
      };
    });

    section.classList.remove('hidden');
    section.scrollIntoView({ behavior: 'smooth', block: 'start' });

    // 전체 결과값 복사 (쉼표 구분)
    el('copy-all-btn').onclick = () => {
      const all = records.map(r =>
        `${r.name}\\${r.ton}\\${r.driver}\\${r.vehicle}\\${r.phone}`
      ).join(',');
      copyToClipboard(all, `전체 ${records.length}건 복사됨`);
    };

    // 전체 TSV 복사 (헤더 포함, 엑셀 그리드 붙여넣기)
    el('copy-tsv-btn').onclick = () => {
      const header = '거래처명\t톤수\t기사명\t차량번호\t연락처';
      const rows   = records.map(r =>
        [r.name, r.ton, r.driver, r.vehicle, r.phone].join('\t')
      );
      copyToClipboard([header, ...rows].join('\n'), `전체 ${records.length}건 TSV 복사됨`);
    };
  }

  /* ─── 클립보드 ──────────────────────────────────── */
  let toastTimer = null;
  function copyToClipboard(text, message = '복사됨') {
    navigator.clipboard.writeText(text).then(() => showToast(message)).catch(() => {
      const ta = Object.assign(document.createElement('textarea'),
        { value: text, style: 'position:fixed;opacity:0;top:0;left:0' });
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast(message);
    });
  }

  function showToast(msg, isError = false) {
    const toast = el('toast');
    el('toast-msg').textContent = msg;
    toast.style.borderColor = isError ? '#ef4444' : '';
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
  }

  function esc(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  </script>

</body>
</html>
