<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>하불 배차 계산 · 코스표 관리 시스템</title>
  <link rel="stylesheet" href="/css/common.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .result-card{background:linear-gradient(145deg,rgba(39,39,42,.92),rgba(24,24,27,.82))}
    .winner{border-color:rgba(16,185,129,.65);box-shadow:0 0 0 1px rgba(16,185,129,.14),0 18px 45px rgba(0,0,0,.2)}
    .vehicle-card{background:rgba(9,9,11,.48)}
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <header class="border-b border-zinc-800 bg-zinc-900/95 sticky top-0 z-30 backdrop-blur">
    <div class="max-w-[1200px] mx-auto px-4 py-3 flex items-center gap-3">
      <a href="/admin/" class="text-xs text-zinc-400 hover:text-zinc-100">← 관리 허브</a>
      <div class="w-8 h-8 rounded-lg border border-emerald-600/40 bg-emerald-600/15 flex items-center justify-center text-emerald-300 font-bold">₩</div>
      <h1 class="text-base font-semibold">하불 배차 계산</h1>
      <div class="flex-1"></div>
      <span id="user-badge" class="text-xs text-zinc-400 hidden sm:inline"></span>
      <a href="/" class="btn btn-ghost text-xs">대시보드</a>
    </div>
  </header>

  <main class="max-w-[1200px] mx-auto px-4 py-6 space-y-5">
    <section class="rounded-xl border border-zinc-700 bg-zinc-900/70 p-4 sm:p-5">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
        <label><span class="app-label">상차센터/상차지</span><select id="origin" class="app-input"><option value="김해">김해</option><option value="양산">양산</option></select></label>
        <label><span class="app-label">하차지</span><input id="destination" class="app-input" list="destination-list" autocomplete="off"><datalist id="destination-list"></datalist></label>
        <label><span class="app-label">냉동 P</span><input id="frozen" class="app-input" type="number" min="0" step="1" value="0" inputmode="numeric"></label>
        <label><span class="app-label">냉장 P</span><input id="chilled" class="app-input" type="number" min="0" step="1" value="0" inputmode="numeric"></label>
      </div>
      <div class="mt-4 flex justify-end"><button id="calculate" class="btn btn-primary px-5">최저가 조합 계산</button></div>
    </section>

    <section id="summary" class="hidden rounded-xl border border-zinc-700 bg-zinc-900/55 p-4"></section>
    <section id="results" class="space-y-4"></section>
  </main>

  <script type="module">
    import {requireRole} from '/js/auth.js';
    import {decorateCenterLinks,forceCenterSelectionFromUrl,mountHeaderCenterSwitcher,requireSelectedCenter,withCenterParam} from '/js/center.js';
    import {calculateHaulCombinations,destinationsFor} from '/js/haul-dispatch-calculator.js';
    import {isPrivateFeatureOwner,loadPrivateFeatures} from '/js/private-features.js';

    const $=id=>document.getElementById(id);
    const profile=await requireRole('editor');
    if(!profile)throw new Error('Unauthorized');
    await requireSelectedCenter({force:forceCenterSelectionFromUrl()});
    mountHeaderCenterSwitcher(next=>location.replace(withCenterParam(location.pathname,next)));
    decorateCenterLinks(document);
    $('user-badge').textContent=`${profile.display_name||profile.email||''} (${profile.role})`;
    const showPrices=isPrivateFeatureOwner(profile)&&loadPrivateFeatures(profile).haulPrices;

    $('origin').addEventListener('change',refreshDestinations);
    $('calculate').addEventListener('click',calculate);
    refreshDestinations();

    function refreshDestinations(){
      const destinations=destinationsFor($('origin').value);
      $('destination-list').innerHTML=destinations.map(value=>`<option value="${escapeHtml(value)}"></option>`).join('');
      if(!destinations.includes($('destination').value))$('destination').value=destinations[0]||'';
    }

    function calculate(){
      try{
        const origin=$('origin').value,destination=$('destination').value.trim(),frozen=Number($('frozen').value),chilled=Number($('chilled').value);
        if(!destinationsFor(origin).includes(destination))throw new Error('단가표에 등록된 하차지를 선택해 주세요.');
        const results=calculateHaulCombinations({origin,destination,frozen,chilled,limit:10});
        renderSummary(origin,destination,frozen,chilled,results);
        $('results').innerHTML=results.map(renderResult).join('');
      }catch(error){$('summary').classList.remove('hidden');$('summary').innerHTML=`<div class="text-sm text-red-300">${escapeHtml(error.message||String(error))}</div>`;$('results').innerHTML=''}
    }

    function renderSummary(origin,destination,frozen,chilled,results){
      $('summary').classList.remove('hidden');
      $('summary').innerHTML=`<div class="flex flex-wrap items-center gap-x-5 gap-y-2 text-sm"><strong>${escapeHtml(origin)} → ${escapeHtml(destination)}</strong><span class="text-sky-300">냉동 ${frozen}P</span><span class="text-emerald-300">냉장 ${chilled}P</span><span class="ml-auto text-zinc-400">경제적인 조합 ${results.length}개</span></div>`;
    }

    function renderResult(result){
      return `<article class="result-card ${result.rank===1?'winner':''} rounded-xl border border-zinc-700 overflow-hidden">
        <header class="p-4 border-b border-zinc-700/80 flex flex-wrap items-center gap-3">
          <div><div class="text-xl font-bold ${result.rank===1?'text-emerald-300':'text-zinc-100'}">${result.rank}위</div>${showPrices?`<div class="text-sm text-emerald-300 mt-1">${formatWon(result.totalCost)}</div>`:''}</div>
          ${showPrices&&result.extraCost?`<span class="rounded-full bg-amber-500/10 border border-amber-500/30 px-2 py-1 text-xs text-amber-300">최저가 대비 +${formatWon(result.extraCost)}</span>`:''}
          <div class="ml-auto text-right text-xs text-zinc-400"><div>차량 ${result.vehicleCount}대</div><div>잔여 ${result.idleSpace}P · 혼적 ${result.mixedCount}대</div></div>
        </header>
        <div class="p-4 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">${result.vehicles.map(renderVehicle).join('')}</div>
        <footer class="px-4 py-3 border-t border-zinc-700/70 text-xs text-zinc-300">총 적재 · 냉동 ${result.totalFrozen} / ${result.totalFrozen}P · 냉장 ${result.totalChilled} / ${result.totalChilled}P</footer>
      </article>`;
    }

    function renderVehicle(vehicle){return `<section class="vehicle-card rounded-lg border border-zinc-700 p-3"><div class="flex items-start justify-between gap-2"><div><strong>${vehicle.type}</strong><div class="text-xs text-zinc-500 mt-0.5">${vehicle.mode}</div></div>${showPrices?`<span class="text-xs text-emerald-300">${formatWon(vehicle.rate)}</span>`:''}</div><div class="grid grid-cols-2 gap-2 mt-3 text-xs"><div class="rounded bg-sky-500/10 p-2"><span class="text-zinc-500">냉동</span><div class="font-semibold mt-0.5">${vehicle.frozen}P</div></div><div class="rounded bg-emerald-500/10 p-2"><span class="text-zinc-500">냉장</span><div class="font-semibold mt-0.5">${vehicle.chilled}P</div></div></div><div class="mt-3 text-xs text-zinc-400 flex justify-between"><span>사용 ${vehicle.usedSpace} / ${vehicle.capacity}P</span><span>잔여 ${vehicle.remainingSpace}P</span></div></section>`}
    function formatWon(value){return `${Number(value||0).toLocaleString('ko-KR')}원`}
    function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}
  </script>
</body>
</html>
