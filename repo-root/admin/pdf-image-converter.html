<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>PDF IMG 변환기 · 관리 허브</title>
  <link rel="stylesheet" href="/css/common.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-900 text-zinc-100 min-h-screen">
  <header class="border-b border-zinc-800">
    <div class="max-w-[1200px] mx-auto px-4 py-3 flex items-center gap-3">
      <a href="/admin/" class="text-xs text-zinc-400 hover:text-white">← 관리 허브</a>
      <h1 class="text-base font-semibold">PDF IMG 변환기</h1>
      <div class="flex-1"></div>
      <span id="user-badge" class="text-xs text-zinc-400"></span>
    </div>
  </header>
  <main class="max-w-[1200px] mx-auto px-4 py-6 space-y-5">
    <section class="rounded-lg border border-zinc-700 bg-zinc-800/40 p-4 space-y-3">
      <h2 class="font-semibold">PDF 불러오기</h2>
      <input id="pdf-file" type="file" accept="application/pdf,.pdf" class="block w-full text-sm">
      <p class="text-xs text-zinc-400">페이지별 미리보기와 JPG 변환은 브라우저에서 처리합니다. 저장할 페이지만 체크하세요.</p>
      <p id="load-status" role="status" class="text-sm text-zinc-300"></p>
    </section>
    <section id="assignment" hidden class="rounded-lg border border-zinc-700 bg-zinc-800/40 p-4 space-y-3">
      <h2 class="font-semibold">공통 선택값</h2>
      <p class="text-xs text-zinc-400">아래 선택값을 모든 페이지에 적용한 뒤 각 페이지에서 따로 수정할 수 있습니다. 센터를 바꾸면 해당 센터의 기사 목록이 표시됩니다. 운수사 변경은 저장 파일명에 반영되며 기사 명부의 소속은 바뀌지 않습니다.</p>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
        <label class="text-xs">센터<select id="default-center" class="app-select mt-1"></select></label>
        <label class="text-xs">기사<select id="default-driver" class="app-select mt-1"></select></label>
        <label class="text-xs">운수사<select id="default-company" class="app-select mt-1"></select></label>
        <label class="text-xs">보건증 만료일<input id="default-expiry" type="date" class="app-input mt-1"></label>
      </div>
      <button id="apply-defaults" type="button" class="btn btn-ghost">모든 페이지에 적용</button>
      <p id="connection-status" class="text-xs text-zinc-400" role="status"></p>
    </section>
    <section id="pages" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></section>
    <section id="save-bar" hidden class="sticky bottom-0 rounded-lg border border-zinc-600 bg-zinc-900/95 p-3 flex items-center gap-3 shadow-lg">
      <button id="save-selected" type="button" class="btn btn-primary">선택 페이지 기사 서류로 등록</button>
      <span id="save-status" class="text-sm" role="status" aria-live="polite"></span>
    </section>
  </main>
  <script type="module" src="/js/pdf-image-converter.js"></script>
</body>
</html>
