name: Apply simplified Coupang workflow
on:
  push:
    branches: [main]
    paths:
      - 'repo-root/sql/operations-coupang-simplify.sql'
      - 'configurations/ansan-coupang.json'
      - 'scripts/apply-coupang-simplify.mjs'
      - '.github/workflows/deploy-coupang-workflow.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --ignore-scripts jsdom@26
      - run: node tests/portal-coupang.test.mjs
      - run: node tests/portal-workflow-settings.test.mjs
      - run: node tests/coupang-state.test.mjs
      - name: Apply completion requirements to existing tickets
        run: node scripts/apply-coupang-simplify.mjs
      - name: Register simplified daily template
        run: node scripts/register-ansan-coupang.mjs --apply
      - name: Verify old Coupang tickets and generic task completion
        run: node scripts/check-coupang-simplify.mjs
