name: Deploy Notion course relationships
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/notion-graph/**'
      - 'repo-root/sql/notion-graph-sync.sql'
      - 'scripts/notion-graph-*.mjs'
      - 'tests/notion-graph*.test.mjs'
      - '.github/workflows/deploy-notion-graph.yml'
  workflow_dispatch:
concurrency:
  group: notion-graph-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/notion-graph*.test.mjs tests/notion-points*.test.mjs
      - run: node scripts/notion-graph-deploy.mjs
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase functions deploy notion-points --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - run: supabase functions deploy notion-graph --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - run: node scripts/notion-graph-cycle.mjs
        env:
          NOTION_GRAPH_VERIFY: '1'

