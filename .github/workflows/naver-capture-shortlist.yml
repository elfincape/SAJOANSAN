name: Test and deploy capture API shortlist
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/naver-relations/**'
      - 'scripts/lib/naver-candidate-shortlist.mjs'
      - 'tests/naver-shortlist*.mjs'
      - '.github/workflows/naver-capture-shortlist.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-naver-capture-shortlist
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/naver-shortlist.test.mjs tests/naver-shortlist-handler.test.mjs tests/charter-fuel-naver.test.mjs tests/naver-browser.test.mjs
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Check existing Maps setting names
        run: supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" --output json | jq -e 'any(.[]; .name == "NAVER_MAPS_CLIENT_ID") and any(.[]; .name == "NAVER_MAPS_CLIENT_SECRET")' > /dev/null
      - name: Deploy existing authenticated relations function
        run: supabase functions deploy naver-relations --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
