name: Deploy OneDrive integration
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/onedrive-auth/**'
      - 'supabase/functions/_shared/luna.js'
      - 'supabase/sql/private-mail-report-retry.sql'
      - 'supabase/sql/private-mail-manual-scope.sql'
      - 'tests/private-mail.test.mjs'
      - '.github/workflows/deploy-onedrive.yml'
      - 'repo-root/sql/onedrive-document-sides.sql'
      - 'repo-root/sql/onedrive-pdf.sql'
      - 'repo-root/sql/company-documents.sql'
      - 'scripts/apply-onedrive-migration.mjs'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node tests/onedrive-server.test.mjs
      - run: node tests/onedrive-delete.test.mjs
      - run: node tests/onedrive-pdf.test.mjs
      - run: node tests/driver-documents.test.mjs
      - run: node tests/driver-pdf-batch.test.mjs
      - run: node tests/company-documents.test.mjs
      - run: node --test tests/private-mail.test.mjs
      - name: Apply bounded OneNote retry functions
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const { SUPABASE_PROJECT_REF: ref, SUPABASE_ACCESS_TOKEN: token } = process.env;
          if (!/^[a-z]{20}$/.test(ref || '') || !token) throw Error('Supabase deployment secrets are missing');
          const response = await fetch(`https://api.supabase.com/v1/projects/${ref}/database/query`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: readFileSync('supabase/sql/private-mail-report-retry.sql', 'utf8') }),
            signal: AbortSignal.timeout(60000),
          });
          if (!response.ok) throw Error(`OneNote retry migration failed (HTTP ${response.status})`);
          JS
      - name: Apply scoped manual message and portal integration
        if: github.event_name == 'workflow_dispatch' || contains(toJSON(github.event.commits), 'supabase/sql/private-mail-manual-scope.sql')
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const { SUPABASE_PROJECT_REF: ref, SUPABASE_ACCESS_TOKEN: token } = process.env;
          if (!/^[a-z]{20}$/.test(ref || '') || !token) throw Error('Supabase deployment secrets are missing');
          const response = await fetch(`https://api.supabase.com/v1/projects/${ref}/database/query`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: readFileSync('supabase/sql/private-mail-manual-scope.sql', 'utf8') }),
            signal: AbortSignal.timeout(60000),
          });
          if (!response.ok) throw Error(`Scoped manual migration failed (HTTP ${response.status})`);
          JS
      - name: Apply front/back document schema
        if: github.event_name == 'workflow_dispatch' || contains(toJSON(github.event.commits), 'repo-root/sql/onedrive-document-sides.sql') || contains(toJSON(github.event.commits), 'repo-root/sql/onedrive-pdf.sql') || contains(toJSON(github.event.commits), 'repo-root/sql/company-documents.sql') || contains(toJSON(github.event.commits), 'scripts/apply-onedrive-migration.mjs')
        run: node scripts/apply-onedrive-migration.mjs
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - name: Deploy authenticated handler and OAuth callback
        # Callback carries Microsoft code/state, not a Supabase JWT.
        # handler.js verifies Supabase JWT and role on every non-callback action.
        run: supabase functions deploy onedrive-auth --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --yes
