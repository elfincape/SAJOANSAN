name: Naver map browser server
on:
  push:
    branches: [main]
    paths:
      - 'scripts/lib/naver-map-browser.mjs'
      - 'scripts/lib/naver-course-optimizer.mjs'
      - 'scripts/lib/naver-route-evidence.mjs'
      - 'scripts/lib/naver-capture-storage.mjs'
      - 'scripts/lib/naver-capture-contract.mjs'
      - 'repo-root/sql/naver-course-captures.sql'
      - 'repo-root/sql/naver-address-validation.sql'
      - 'repo-root/sql/naver-capture-shortlist.sql'
      - 'scripts/lib/naver-capture-shortlist-check.sql'
      - 'supabase/functions/naver-relations/course-permutations.js'
      - 'scripts/lib/naver-address-validation-check.sql'
      - 'scripts/check-naver-map-browser.mjs'
      - '.github/workflows/naver-browser-server.yml'
      - 'scripts/naver-browser-*.mjs'
      - 'scripts/apply-naver-browser-migration.mjs'
      - 'scripts/check-naver-browser-queue.mjs'
      - 'repo-root/sql/naver-browser-jobs.sql'
      - 'repo-root/js/naver-browser-*.js'
      - 'repo-root/admin/naver-shortest-distance.html'
      - 'tests/naver-browser*.mjs'
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.64.1 jsdom@26 exceljs@4.4.0 xlsx@0.18.5
      - run: npx playwright install --with-deps chromium
      - run: node tests/naver-browser.test.mjs
      - run: node tests/naver-browser-worker.test.mjs
      - run: node tests/naver-browser-lifecycle.test.mjs
      - run: node tests/naver-browser-ui.test.mjs
      - run: node scripts/check-naver-map-browser.mjs --first-search
      - run: node scripts/apply-naver-browser-migration.mjs
      - run: node scripts/check-naver-browser-queue.mjs --live --capture
  replace:
    needs: [verify]
    if: github.event_name == 'push' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/naver-browser-replace.mjs
        env:
          GH_TOKEN: ${{ github.token }}
  worker:
    needs: [verify, replace]
    if: always() && !cancelled() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') && (needs.replace.result == 'success' || needs.replace.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      actions: write
    concurrency:
      group: naver-browser-queue-worker
      cancel-in-progress: ${{ github.event_name == 'push' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      NAVER_WORKER_MINUTES: ${{ github.event_name == 'push' && '2' || '45' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/naver-browser-worker.mjs --serve
      - name: Start next server worker
        run: node scripts/naver-browser-handoff.mjs
        env:
          GH_TOKEN: ${{ github.token }}
