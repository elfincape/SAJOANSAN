name: Naver map browser server
on:
  push:
    branches: [main]
    paths:
      - 'scripts/lib/naver-map-browser.mjs'
      - 'scripts/check-naver-map-browser.mjs'
      - '.github/workflows/naver-browser-server.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-naver-map-browser.mjs
