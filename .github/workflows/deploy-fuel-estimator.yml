name: Test and deploy fuel estimator
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/kakao-distance/**'
      - 'supabase/functions/naver-distance/**'
      - 'scripts/check-naver-distance.mjs'
      - 'repo-root/js/charter-fuel-*.js'
      - 'repo-root/admin/charter-fuel-estimator.html'
      - 'repo-root/admin/index.html'
      - 'repo-root/js/menu-permissions.js'
      - 'repo-root/js/center.js'
      - 'tests/charter-fuel*.mjs'
      - '.github/workflows/deploy-fuel-estimator.yml'
  workflow_dispatch:
concurrency:
  group: deploy-fuel-estimator
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false jsdom@26
      - run: node tests/charter-fuel.test.mjs
      - run: node tests/charter-fuel-ui.test.mjs
      - run: node tests/charter-fuel-naver.test.mjs
      - run: node tests/menu-permissions.test.mjs
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Confirm Kakao secret is configured
        run: supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" --output json | jq -e 'any(.[]; .name == "KAKAO_REST_API_KEY")' > /dev/null
      - name: Deploy authenticated distance calculator
        run: supabase functions deploy kakao-distance --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Confirm Naver secrets are configured
        run: supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" --output json | jq -e 'any(.[]; .name == "NAVER_MAPS_CLIENT_ID") and any(.[]; .name == "NAVER_MAPS_CLIENT_SECRET")' > /dev/null
      - name: Deploy authenticated Naver distance calculator
        run: supabase functions deploy naver-distance --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Verify live Naver address and route APIs
        run: node scripts/check-naver-distance.mjs
