name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/coupang-vision/**'
      - 'supabase/functions/operations-assistant/**'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

jobs:
  deploy-edge-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      AIAPIFLOW_API_KEY: ${{ secrets.AIAPIFLOW_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN secret"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Missing SUPABASE_PROJECT_REF secret"; exit 1; }
          test -n "$AIAPIFLOW_API_KEY" || { echo "Missing AIAPIFLOW_API_KEY secret"; exit 1; }

      - name: Install Supabase CLI
        run: npm install -g supabase@latest

      - name: Set AIAPIFlow secret
        run: supabase secrets set AIAPIFLOW_API_KEY="$AIAPIFLOW_API_KEY" --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy operations-assistant function
        run: supabase functions deploy operations-assistant --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy coupang-vision function
        run: supabase functions deploy coupang-vision --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
