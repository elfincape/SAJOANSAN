name: Manually sync Notion health management
on:
  workflow_dispatch:
concurrency:
  group: notion-health-completion
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sync targets and complete renewed certificates
        run: node scripts/run-notion-health-completion.mjs
